<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>S222 Throne Rush Calendar</title>

  <link rel="stylesheet" href="calendar.css">
</head>

<body>

  <header class="header">
    <div>
      <h1>S222 Throne Rush Calendar</h1>
      <p id="event-period">Event: --</p>
    </div>

    <div class="header-buttons">

      <button
        id="addScheduleBtn"
        class="main-button"
      >
        Add Schedule
      </button>

      <button
        id="refreshBtn"
        class="secondary-button"
      >
        🔄 Refresh
      </button>

    </div>
  </header>


  <!-- Month Navigation -->
  <div class="month-navigation">

    <button id="prevMonth">‹</button>

    <h2 id="monthTitle"></h2>

    <button id="nextMonth">›</button>

  </div>


  <!-- Weekday -->
  <div id="weekdayHeader"></div>


  <!-- Calendar -->
  <main id="calendarWrapper">

    <div id="calendar"></div>

  </main>
<!-- Guild Summary Table -->
<section id="guildSummary" class="guild-summary">

  <button
    type="button"
    id="summaryToggle"
    class="summary-toggle"
    aria-expanded="false"
  >
    <div class="summary-preview">
      <span id="summaryPreviewGuild">Guild</span>
      <span id="summaryPreviewLeague">—</span>
    </div>

    <div class="summary-preview-cell">
      <strong id="summaryPreviewDays">0</strong>
      <small>days</small>
      <span id="summaryPreviewBases">0</span>
      <small>bases</small>
    </div>

    <span class="summary-arrow">▲</span>
  </button>


  <div id="summaryTableWrapper" class="summary-table-wrapper">

    <table id="summaryTable">

      <thead>

        <tr>
          <th rowspan="2">Guild</th>
          <th rowspan="2">League</th>

          <th colspan="2">Lv4</th>
          <th colspan="2">Lv5</th>
          <th colspan="2">Lv6</th>
          <th colspan="2">Lv7</th>

          <th rowspan="2">Total</th>
        </tr>

        <tr>
          <th>Days</th>
          <th>Bases</th>

          <th>Days</th>
          <th>Bases</th>

          <th>Days</th>
          <th>Bases</th>

          <th>Days</th>
          <th>Bases</th>
        </tr>

      </thead>

      <tbody id="summaryTableBody">
      </tbody>

      <tfoot id="summaryTableFoot">
      </tfoot>

    </table>

  </div>

</section>

  <!-- Guild Summary -->
  <section
    id="guildSummaryPanel"
    class="guild-summary-panel"
  >

    <button
      id="guildSummaryToggle"
      class="guild-summary-toggle"
      type="button"
    >

      <div class="guild-summary-toggle-left">

        <span class="summary-handle"></span>

        <span>
          Guild Occupation Summary
        </span>

      </div>

      <span
        id="guildSummaryArrow"
        class="summary-arrow"
      >
        ▲
      </span>

    </button>


    <!-- Collapsed / Current Guild -->
    <div
      id="currentGuildSummary"
      class="current-guild-summary"
    >
    </div>


    <!-- Full Table -->
    <div
      id="guildSummaryContent"
      class="guild-summary-content"
    >

      <div class="summary-table-wrapper">

        <table
          id="guildSummaryTable"
          class="guild-summary-table"
        >

          <thead>

            <tr>

              <th>Guild</th>

              <th>League</th>

              <th>Lv4</th>

              <th>Lv5</th>

              <th>Lv6</th>

              <th>Lv7</th>

              <th>Total</th>

            </tr>

          </thead>

          <tbody></tbody>

        </table>

      </div>

    </div>

  </section>


  <!-- Schedule Input -->
  <dialog id="scheduleDialog">

    <form id="scheduleForm">

      <div class="dialog-header">

        <h2 id="dialogTitle">Add Schedule</h2>

        <button
          type="button"
          id="closeDialog"
          class="close-button"
        >
          ×
        </button>

      </div>


      <!-- Guild VS League -->
      <label>

        Guild VS League

        <select id="league" required>

          <option value="" selected disabled>
            Select League
          </option>

          <option value="Bronze">
            Bronze
          </option>

          <option value="Silver">
            Silver
          </option>

          <option value="Gold">
            Gold
          </option>

        </select>

      </label>


      <!-- Fortress -->
      <label>

        Fortress

        <select id="fortress" required>

          <option value="Lv7">
            Lv7
          </option>

          <option value="Lv6">
            Lv6
          </option>

          <option value="Lv5">
            Lv5
          </option>

          <option value="Lv4">
            Lv4
          </option>

          <option value="Lv1-3">
            Lv1–3
          </option>

        </select>

      </label>


      <!-- Coordinate -->
      <fieldset>

        <legend>Coordinate</legend>

        <div class="coordinate">

          <input
            id="coordinateX"
            type="number"
            min="0"
            placeholder="X"
            required
          >

          <span>:</span>

          <input
            id="coordinateY"
            type="number"
            min="0"
            placeholder="Y"
            required
          >

        </div>

      </fieldset>


      <!-- Guild -->
      <label>

        Guild

        <input
          id="guild"
          type="text"
          maxlength="80"
          required
        >

      </label>


      <!-- Start -->
      <fieldset>

        <legend>Start — Attack Start</legend>

        <div class="datetime">

          <div>

            <span>Date</span>

            <input
              id="startDate"
              type="date"
              required
            >

          </div>

          <div>

            <span>GMT</span>

            <input
              id="startGMT"
              type="time"
              required
            >

          </div>

          <div>

            <span>JST</span>

            <input
              id="startJST"
              type="time"
              required
            >

          </div>

        </div>

      </fieldset>


      <!-- End -->
      <fieldset>

        <legend>End — Planned Handover</legend>

        <div class="datetime">

          <div>

            <span>Date</span>

            <input
              id="endDate"
              type="date"
              required
            >

          </div>

          <div>

            <span>GMT</span>

            <input
              id="endGMT"
              type="time"
              required
            >

          </div>

          <div>

            <span>JST</span>

            <input
              id="endJST"
              type="time"
              required
            >

          </div>

        </div>

      </fieldset>


      <!-- Description -->
      <label>

        Description

        <textarea
          id="description"
          rows="4"
          maxlength="1000"
        ></textarea>

      </label>


      <p
        id="formError"
        class="error"
      ></p>


      <div class="form-buttons">

        <button
          type="button"
          id="deleteBtn"
          class="delete-button"
        >
          Delete
        </button>

        <div>

          <button
            type="button"
            id="cancelBtn"
            class="secondary-button"
          >
            Cancel
          </button>

          <button
            type="submit"
            class="main-button"
          >
            Save
          </button>

        </div>

      </div>

    </form>

  </dialog>


  <!-- Detail -->
  <dialog id="detailDialog">

    <div class="detail">

      <div class="dialog-header">

        <h2 id="detailTitle"></h2>

        <button
          id="closeDetail"
          class="close-button"
        >
          ×
        </button>

      </div>


      <div id="detailContent"></div>


      <!-- Color -->
      <div class="color-control">

        <label>
          Schedule Color
        </label>

        <div
          id="scheduleColorPalette"
          class="color-palette"
        ></div>

      </div>


      <div class="detail-buttons">

        <button
          id="editSchedule"
          class="secondary-button"
        >
          Edit
        </button>

        <button
          id="detailClose"
          class="main-button"
        >
          Close
        </button>

      </div>

    </div>

  </dialog>


  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <script src="calendar.js"></script>

</body>
</html>
