<style>

/* =====================================
   S222TR NAVIGATION ROADMAP
   ===================================== */

.tr-roadmap {

    position: relative;

    width: 100%;
    max-width: 760px;

    aspect-ratio: 760 / 650;

    padding-bottom: 10pt;

    margin: 20px auto 0px;

    background: #090909;

    overflow: hidden;

    border-radius: 14px;

}


/* =====================================
   SVG
   ===================================== */

.tr-roadmap-svg {

    position: absolute;

    inset: 0;

    width: 100%;
    height: 100%;

    pointer-events: none;

    transform: translateY(-20px);

}


/* =====================================
   MAIN ROUTES
   ===================================== */

.tr-route-magenta,
.tr-route-lime,
.tr-route-cyan {

    fill: none;

    stroke-width: 6;

    stroke-linecap: round;

    stroke-linejoin: round;

}


.tr-route-magenta {

    stroke: #ff00cc;

    filter: drop-shadow(0 0 4px #ff00cc);

}


.tr-route-lime {

    stroke: #aaff00;

    filter: drop-shadow(0 0 4px #aaff00);

}


.tr-route-cyan {

    stroke: #00eaff;

    filter: drop-shadow(0 0 4px #00eaff);

}


/* =====================================
   BRANCH ROUTES
   ===================================== */

.tr-branch-magenta,
.tr-branch-lime,
.tr-branch-cyan {

    fill: none;

    stroke-width: 4;

    stroke-linecap: round;

    stroke-linejoin: round;

}


.tr-branch-magenta {

    stroke: #ff00cc;

    filter: drop-shadow(0 0 3px #ff00cc);

}


.tr-branch-lime {

    stroke: #aaff00;

    filter: drop-shadow(0 0 3px #aaff00);

}


.tr-branch-cyan {

    stroke: #00eaff;

    filter: drop-shadow(0 0 3px #00eaff);

}


/* =====================================
   ROUTE POINTS
   ===================================== */

.tr-route-point {

    stroke: none;

}


.tr-point-magenta {

    fill: #ff00cc;

}


.tr-point-lime {

    fill: #aaff00;

}


.tr-point-cyan {

    fill: #00eaff;

}


/* =====================================
   MAIN NODES
   ===================================== */

.tr-main-node {

    position: absolute;

    width: 64px;
    height: 64px;

    padding: 4px;

    display: flex;

    align-items: center;
    justify-content: center;

    border-radius: 50%;

    background: #090909;

    border: 5px solid;

    text-decoration: none;

    font-size: 16px;

    font-weight: 400;

    line-height: 1;

    white-space: nowrap;

    text-align: center;

    z-index: 10;

    box-sizing: border-box;

    transform: translate(-50%, calc(-50% + 11pt));

    margin-top: -20px;

    filter: drop-shadow(0 0 5px rgba(0, 0, 0, 0.85));

    transition:
        transform 0.15s ease,
        background 0.15s ease;

}


/* =====================================
   MAIN NODE COLORS
   ===================================== */

.tr-node-magenta {

    color: #ff00cc;

    border-color: #ff00cc;

}


.tr-node-lime {

    color: #aaff00;

    border-color: #aaff00;

}


.tr-node-cyan {

    color: #00eaff;

    border-color: #00eaff;

}


.tr-main-node:hover {

    transform:
        translate(-50%, calc(-50% + 11pt))
        scale(1.06);

    background: #111;

}


/* =====================================
   START / OVERVIEW SQUARE NODES
   ===================================== */

.tr-square-node {

    position: absolute;

    display: flex;

    align-items: center;
    justify-content: center;

    width: 96px;
    height: 42px;

    box-sizing: border-box;

    background: #090909;

    border: 4px solid #ff00cc;

    color: #ff00cc;

    text-decoration: none;

    font-size: 15px;

    font-weight: 400;

    line-height: 1;

    white-space: nowrap;

    z-index: 10;

    transform: translate(-50%, calc(-50% + 11pt));

    margin-top: -20px;

    filter: drop-shadow(0 0 5px rgba(0, 0, 0, 0.85));

    transition:
        transform 0.15s ease,
        background 0.15s ease;

}


/* =====================================
   START ONLY
   ===================================== */

.tr-square-node.tr-start {

    color: #ffffff;

}


/* =====================================
   SQUARE NODE HOVER
   ===================================== */

.tr-square-node:hover {

    transform:
        translate(-50%, calc(-50% + 11pt))
        scale(1.06);

    background: #111;

}


/* =====================================
   BRANCH LINKS
   ===================================== */

.tr-branch-link {

    position: absolute;

    display: inline-flex;

    align-items: center;
    justify-content: center;

    padding: 4px 8px;

    background: #090909;

    text-decoration: none;

    font-size: 15px;

    font-weight: 400;

    line-height: 1.1;

    white-space: nowrap;

    border: 2px solid;

    border-radius: 5px;

    box-sizing: border-box;

    z-index: 10;

    transform: translate(-50%, -50%);

    margin-top: -20px;

    transition:
        transform 0.15s ease,
        background 0.15s ease;

}


/* =====================================
   LINK COLORS
   ===================================== */

.tr-link-magenta {

    color: #ff00cc;

    border-color: #ff00cc;

}


.tr-link-lime {

    color: #aaff00;

    border-color: #aaff00;

}


.tr-link-cyan {

    color: #00eaff;

    border-color: #00eaff;

}


.tr-branch-link:hover {

    background: #111;

    transform:
        translate(-50%, -50%)
        scale(1.05);

}


/* =====================================
   SEASON TIMELINE
   ===================================== */

.tr-season {

    position: absolute;

    left: 8%;
    right: 8%;

    bottom: 3%;

    display: flex;

    align-items: center;

    gap: 10px;

    color: #aaa;

    font-size: 12px;

    font-weight: 400;

    z-index: 5;

}


/* =====================================
   SEASON TIMELINE GRADIENT
   ===================================== */

.tr-season-line {

    position: relative;

    flex: 1;

    height: 3px;

    background:
        linear-gradient(
            90deg,
            #ff00cc 0%,
            #aaff00 50%,
            #00eaff 100%
        );

    border-radius: 10px;

}


/* =====================================
   SEASON TIMELINE CURRENT POINT
   ===================================== */

.tr-season-current {

    position: absolute;

    left: 50%;

    top: 50%;

    width: 12px;
    height: 12px;

    transform: translate(-50%, -50%);

    background: #ffffff;

    border: 2px solid #090909;

    border-radius: 50%;

    box-shadow:
        0 0 5px #ffffff,
        0 0 10px rgba(255, 255, 255, 0.9);

}


/* =====================================
   MANUAL TOOLBAR
   ===================================== */

.manual-tools {

    width: 100%;
    max-width: 760px;

    margin: 15px auto 20px;

    display: flex;

    align-items: center;

    gap: 10px;

    box-sizing: border-box;

}


#manual-search {

    flex: 1;

    min-width: 0;

    height: 40px;

    padding: 0 12px;

    box-sizing: border-box;

    background: #090909;

    border: 2px solid #555;

    border-radius: 6px;

    color: #ffffff;

    font-size: 14px;

    outline: none;

}


#manual-search:focus {

    border-color: #888;

}


#manual-search::placeholder {

    color: #888;

}


/* =====================================
   DISCORD BACK BUTTON
   ===================================== */

.manual-back {

    display: inline-flex;

    align-items: center;
    justify-content: center;

    min-height: 40px;

    padding: 0 14px;

    box-sizing: border-box;

    background: #090909;

    border: 2px solid #7289da;

    border-radius: 6px;

    color: #ffffff;

    text-decoration: none;

    white-space: nowrap;

    transition:
        background 0.15s ease,
        transform 0.15s ease;

}


.manual-back:hover {

    background: #111;

    transform: translateY(-1px);

}


/* =====================================
   SEARCH RESULTS
   ===================================== */

.manual-search-results {

    width: 100%;

    max-width: 760px;

    margin: -10px auto 25px;

    display: none;

    box-sizing: border-box;

}


.manual-search-result {

    display: block;

    width: 100%;

    margin-bottom: 6px;

    padding: 10px 12px;

    box-sizing: border-box;

    background: #090909;

    border: 1px solid #444;

    border-radius: 5px;

    color: #ddd;

    text-decoration: none;

}


.manual-search-result:hover {

    background: #111;

}


.manual-search-result-title {

    display: block;

    margin-bottom: 3px;

    color: #ffffff;

    font-weight: 600;

}


.manual-search-result-text {

    display: block;

    color: #999;

    font-size: 12px;

}


.manual-search-empty {

    padding: 10px 12px;

    color: #888;

}


/* =====================================
   SEARCH HIGHLIGHT
   ===================================== */

.manual-highlight {

    outline: 2px solid #ffffff;

    outline-offset: 5px;

}

/* =====================================
   FORTRESS CONDITION CARD
   ===================================== */

.fortress-card {
    margin: 14px 0 20px;
    padding: 12px 14px;
    background: #090909;
    border: 1px solid #404249;
    border-radius: 8px;
}

.fortress-card-title {
    margin-bottom: 10px;
    color: #f2f3f5;
    font-size: 15px;
    font-weight: 700;
}

.fortress-card-row {
    display: flex;
    justify-content: space-between;
    gap: 15px;
    padding: 7px 0;
    border-top: 1px solid #2b2d31;
    font-size: 13px;
}

.fortress-card-row span {
    color: #949ba4;
}

.fortress-card-row strong {
    color: #f2f3f5;
    text-align: right;
}
/* =====================================
   MARKDOWN CONTENT
   ===================================== */

.section-content img {

    max-width: 100%;

    height: auto;

}


.section-content h3 {

    margin-top: 24px;

}


.section-content ul {

}


.section-content li {

}


/* =====================================

    }

        font-size: 13px;

    }


    .manual-search-results {

        padding: 0 10px;

    }

}
