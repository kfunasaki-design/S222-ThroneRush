<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Translation Overlay</title>
  <link rel="stylesheet" href="translation.css">
</head>
<body>
  <main class="translation-app">
    <header class="app-header">
      <div>
        <p class="eyebrow">S222 THRONE RUSH TOOLS</p>
        <h1>Translation</h1>
        <p class="subtitle">Translate without leaving your screen.</p>
      </div>

      <button id="toggleOverlay" class="icon-button" type="button"
              aria-label="オーバーレイ表示切替">
        <span id="toggleIcon">▣</span>
      </button>
    </header>

    <section class="translator-panel">
      <div class="language-row">
        <label>
          <span>翻訳元</span>
          <select id="sourceLanguage">
            <option value="auto">自動検出</option>
            <option value="en">英語</option>
            <option value="ja">日本語</option>
            <option value="ko">韓国語</option>
            <option value="zh-CN">中国語</option>
            <option value="fr">フランス語</option>
            <option value="de">ドイツ語</option>
            <option value="ru">ロシア語</option>
          </select>
        </label>

        <button id="swapLanguages" class="swap-button"
                type="button" title="言語を入れ替え">
          ⇄
        </button>

        <label>
          <span>翻訳先</span>
          <select id="targetLanguage">
            <option value="ja" selected>日本語</option>
            <option value="en">英語</option>
            <option value="ko">韓国語</option>
            <option value="zh-CN">中国語</option>
            <option value="fr">フランス語</option>
            <option value="de">ドイツ語</option>
            <option value="ru">ロシア語</option>
          </select>
        </label>
      </div>

      <div class="text-section">
        <div class="section-heading">
          <label for="sourceText">翻訳するテキスト</label>
          <button id="clearText" class="text-button" type="button">
            クリア
          </button>
        </div>

        <textarea id="sourceText"
          placeholder="翻訳したい文章を入力、または貼り付けてください。"
          maxlength="5000"></textarea>

        <div class="input-footer">
          <span id="charCount">0 / 5000</span>
          <button id="translateButton" class="primary-button" type="button">
            翻訳する
          </button>
        </div>
      </div>

      <div class="text-section result-section">
        <div class="section-heading">
          <label>翻訳結果</label>
          <button id="copyResult" class="text-button" type="button">
            コピー
          </button>
        </div>

        <div id="translationResult" class="result-box" aria-live="polite">
          <span class="result-placeholder">
            翻訳結果がここに表示されます。
          </span>
        </div>
      </div>

      <p id="statusMessage" class="status-message" aria-live="polite">
        翻訳エンジン未接続 — UIプロトタイプ
      </p>
    </section>

    <section id="overlayPreview" class="overlay-preview">
      <div class="overlay-titlebar">
        <span class="overlay-dot"></span>
        <strong>Translation Overlay</strong>
        <button id="closeOverlay" type="button" aria-label="閉じる">×</button>
      </div>

      <div class="overlay-content">
        <p class="overlay-label">翻訳プレビュー</p>
        <div id="overlayText">
          翻訳結果がここに表示されます。
        </div>
      </div>

      <div class="overlay-footer">
        <span>Prototype</span>
        <button id="overlayCopy" type="button">コピー</button>
      </div>
    </section>

    <footer class="app-footer">
      <span>Translation Prototype</span>
      <span>OCR: Disabled</span>
    </footer>
  </main>

  <script src="translation.js"></script>
</body>
</html>
