<script>

/* =========================================================
   Elements
========================================================= */

const editor =
  document.getElementById(
    "editor"
  );

const canvas =
  document.getElementById(
    "canvas"
  );

const ctx =
  canvas.getContext(
    "2d"
  );

const empty =
  document.getElementById(
    "empty"
  );

const fileInput =
  document.getElementById(
    "fileInput"
  );

const loadButton =
  document.getElementById(
    "loadButton"
  );

const cropButton =
  document.getElementById(
    "cropButton"
  );

const deleteButton =
  document.getElementById(
    "deleteButton"
  );

const clearButton =
  document.getElementById(
    "clearButton"
  );

const undoButton =
  document.getElementById(
    "undoButton"
  );

const saveButton =
  document.getElementById(
    "saveButton"
  );

const colorInput =
  document.getElementById(
    "colorInput"
  );

const colorPreview =
  document.getElementById(
    "colorPreview"
  );

const cropOverlay =
  document.getElementById(
    "cropOverlay"
  );


/* =========================================================
   State
========================================================= */

let image = null;

let objects = [];

let selectedObject = null;

let currentTool = null;

let numberIndex = 0;

let letterIndex = 0;

let history = [];

let cropMode = false;

let cropStart = null;

let cropEnd = null;


/* =========================================================
   View
========================================================= */

let viewScale = 1;

let viewX = 0;

let viewY = 0;

let minScale = 0.1;

let maxScale = 5;


/* =========================================================
   Pointer
========================================================= */

let pointerMode = null;

let startPointer = null;

let lastPointer = null;

let startObjectState = null;

const pointers =
  new Map();

let pinchStartDistance = 0;

let pinchStartScale = 1;

let pinchStartView = null;


/* =========================================================
   Color
========================================================= */

function updateColorPreview() {

  colorPreview.style.background =
    colorInput.value;

}

updateColorPreview();

colorInput.addEventListener(
  "input",
  () => {

    updateColorPreview();

  }
);


/* =========================================================
   History
========================================================= */

function cloneObjects() {

  return JSON.parse(
    JSON.stringify(
      objects
    )
  );

}


function saveHistory() {

  history.push({

    objects:
      cloneObjects(),

    numberIndex,

    letterIndex,

    imageSrc:
      image
        ? canvas.toDataURL(
            "image/png"
          )
        : null,

    canvasWidth:
      canvas.width,

    canvasHeight:
      canvas.height

  });

  if (
    history.length > 30
  ) {

    history.shift();

  }

}


/* =========================================================
   Undo
========================================================= */

async function undo() {

  if (
    !history.length
  ) {

    return;

  }

  const state =
    history.pop();

  objects =
    state.objects || [];

  numberIndex =
    state.numberIndex || 0;

  letterIndex =
    state.letterIndex || 0;

  selectedObject = null;


  if (
    state.imageSrc
  ) {

    const restored =
      new Image();

    restored.onload =
      () => {

        image =
          restored;

        canvas.width =
          state.canvasWidth;

        canvas.height =
          state.canvasHeight;

        fitImage();

        draw();

      };

    restored.src =
      state.imageSrc;

  } else {

    draw();

  }

}


undoButton.addEventListener(
  "click",
  event => {

    event.stopPropagation();

    undo();

  }
);


/* =========================================================
   Load
========================================================= */

loadButton.addEventListener(
  "click",
  () => {

    fileInput.click();

  }
);


empty.addEventListener(
  "click",
  () => {

    fileInput.click();

  }
);


/* =========================================================
   Drag & Drop
========================================================= */

empty.addEventListener(
  "dragover",
  event => {

    event.preventDefault();

    empty.classList.add(
      "dragover"
    );

  }
);


empty.addEventListener(
  "dragleave",
  event => {

    event.preventDefault();

    empty.classList.remove(
      "dragover"
    );

  }
);


empty.addEventListener(
  "drop",
  event => {

    event.preventDefault();

    empty.classList.remove(
      "dragover"
    );

    const files =
      event.dataTransfer.files;

    if (
      !files ||
      !files.length
    ) {

      return;

    }

    loadImageFile(
      files[0]
    );

  }
);


/* =========================================================
   File Input
========================================================= */

fileInput.addEventListener(
  "change",
  event => {

    const file =
      event.target.files[0];

    if (!file) {

      return;

    }

    loadImageFile(
      file
    );

    fileInput.value = "";

  }
);


/* =========================================================
   Load Image File
========================================================= */

function loadImageFile(
  file
) {

  if (
    !file.type.startsWith(
      "image/"
    )
  ) {

    return;

  }

  const reader =
    new FileReader();

  reader.onload =
    event => {

      const img =
        new Image();

      img.onload =
        () => {

          image =
            img;

          canvas.width =
            img.naturalWidth;

          canvas.height =
            img.naturalHeight;

          objects = [];

          history = [];

          selectedObject = null;

          numberIndex = 0;

          letterIndex = 0;

          currentTool = null;

          cropMode = false;

          cropButton.classList.remove(
            "active"
          );

          document
            .querySelectorAll(
              "[data-tool]"
            )
            .forEach(
              b =>
                b.classList.remove(
                  "active"
                )
            );

          empty.style.display =
            "none";

          fitImage();

          draw();

        };

      img.src =
        event.target.result;

    };

  reader.readAsDataURL(
    file
  );

}


/* =========================================================
   Fit Image
========================================================= */

function fitImage() {

  if (!image) {

    return;

  }

  const width =
    editor.clientWidth;

  const height =
    editor.clientHeight;

  viewScale =
    height /
    canvas.height;

  viewX =
    (
      width -
      canvas.width *
      viewScale
    ) / 2;

  viewY = 0;

  applyCanvasTransform();

}


/* =========================================================
   Canvas Transform
========================================================= */

function applyCanvasTransform() {

  canvas.style.transform =
    `translate(
      ${viewX}px,
      ${viewY}px
    )
    scale(
      ${viewScale}
    )`;

  updateCropOverlay();

}


/* =========================================================
   Screen -> Image
========================================================= */

function screenToImage(
  clientX,
  clientY
) {

  const rect =
    editor.getBoundingClientRect();

  return {

    x:
      (
        clientX -
        rect.left -
        viewX
      ) /
      viewScale,

    y:
      (
        clientY -
        rect.top -
        viewY
      ) /
      viewScale

  };

}


/* =========================================================
   Image -> Screen
========================================================= */

function imageToScreen(
  x,
  y
) {

  return {

    x:
      x *
      viewScale +
      viewX,

    y:
      y *
      viewScale +
      viewY

  };

}


/* =========================================================
   Tools
========================================================= */

document
  .querySelectorAll(
    "[data-tool]"
  )
  .forEach(
    button => {

      button.addEventListener(
        "click",
        () => {

          if (!image) {

            return;

          }

          currentTool =
            button.dataset.tool;

          cropMode = false;

          cropButton.classList.remove(
            "active"
          );

          document
            .querySelectorAll(
              "[data-tool]"
            )
            .forEach(
              b =>
                b.classList.remove(
                  "active"
                )
            );

          button.classList.add(
            "active"
          );

        }
      );

    }
  );


/* =========================================================
   Crop
========================================================= */

cropButton.addEventListener(
  "click",
  () => {

    if (!image) {

      return;

    }

    cropMode =
      !cropMode;

    currentTool = null;

    document
      .querySelectorAll(
        "[data-tool]"
      )
      .forEach(
        b =>
          b.classList.remove(
            "active"
          )
      );

    cropButton.classList.toggle(
      "active",
      cropMode
    );

    cropStart = null;

    cropEnd = null;

    cropOverlay.style.display =
      "none";

  }
);


/* =========================================================
   Pointer Down
========================================================= */

editor.addEventListener(
  "pointerdown",
  event => {

    if (!image) {

      return;

    }

    /*
     * ボタン類をCanvas操作として
     * 扱わない。
     */

    if (
      event.target.closest(
        ".toolbar"
      ) ||
      event.target.closest(
        ".save-button"
      ) ||
      event.target.closest(
        ".header"
      )
    ) {

      return;

    }


    pointers.set(
      event.pointerId,
      {
        x:
          event.clientX,

        y:
          event.clientY
      }
    );

    editor.setPointerCapture(
      event.pointerId
    );


    if (
      pointers.size === 2
    ) {

      const values =
        [...pointers.values()];

      pinchStartDistance =
        distance(
          values[0],
          values[1]
        );

      pinchStartScale =
        viewScale;

      pinchStartView = {

        x: viewX,
        y: viewY

      };

      pointerMode =
        "pinch";

      return;

    }


    const point =
      screenToImage(
        event.clientX,
        event.clientY
      );


    if (cropMode) {

      cropStart =
        clampPoint(
          point
        );

      cropEnd =
        cropStart;

      pointerMode =
        "crop";

      updateCropOverlay();

      return;

    }


    if (
      currentTool === "number" ||
      currentTool === "letter"
    ) {

      saveHistory();

      const obj = {

        type:
          currentTool,

        x:
          point.x,

        y:
          point.y,

        size:
          Math.max(
            48,
            canvas.width *
            0.045
          ),

        color:
          colorInput.value

      };


      if (
        currentTool ===
        "number"
      ) {

        obj.text =
          [
            "①",
            "②",
            "③",
            "④",
            "⑤"
          ][numberIndex];

        numberIndex++;

        if (
          numberIndex >= 5
        ) {

          numberIndex = 0;

        }

      } else {

        obj.text =
          String.fromCharCode(
            65 +
            letterIndex
          );

        letterIndex++;

        if (
          letterIndex >= 5
        ) {

          letterIndex = 0;

        }

      }

      objects.push(
        obj
      );

      selectedObject =
        obj;

      draw();

      currentTool = null;

      document
        .querySelectorAll(
          "[data-tool]"
        )
        .forEach(
          b =>
            b.classList.remove(
              "active"
            )
        );

      return;

    }


    if (
      currentTool === "circle" ||
      currentTool === "rect" ||
      currentTool === "arrow"
    ) {

      saveHistory();

      startPointer =
        point;

      pointerMode =
        "draw";

      return;

    }


    const hit =
      hitTest(
        point.x,
        point.y
      );

    if (hit) {

      selectedObject =
        hit;

      saveHistory();

      startObjectState =
        JSON.parse(
          JSON.stringify(
            hit
          )
        );

      startPointer =
        point;

      pointerMode =
        "object";

      draw();

      return;

    }


    pointerMode =
      "pan";

    lastPointer = {

      x:
        event.clientX,

      y:
        event.clientY

    };

  }
);


/* =========================================================
   Pointer Move
========================================================= */

editor.addEventListener(
  "pointermove",
  event => {

    if (!image) {

      return;

    }

    if (
      !pointers.has(
        event.pointerId
      )
    ) {

      return;

    }

    pointers.set(
      event.pointerId,
      {
        x:
          event.clientX,

        y:
          event.clientY
      }
    );


    if (
      pointerMode === "pinch" &&
      pointers.size >= 2
    ) {

      const values =
        [...pointers.values()];

      const currentDistance =
        distance(
          values[0],
          values[1]
        );

      if (
        pinchStartDistance <= 0
      ) {

        return;

      }

      const ratio =
        currentDistance /
        pinchStartDistance;

      let newScale =
        pinchStartScale *
        ratio;

      newScale =
        Math.max(
          minScale,
          Math.min(
            maxScale,
            newScale
          )
        );


      const center =
        midpoint(
          values[0],
          values[1]
        );

      const rect =
        editor.getBoundingClientRect();

      const cx =
        center.x -
        rect.left;

      const cy =
        center.y -
        rect.top;


      const imageX =
        (
          cx -
          pinchStartView.x
        ) /
        pinchStartScale;

      const imageY =
        (
          cy -
          pinchStartView.y
        ) /
        pinchStartScale;


      viewScale =
        newScale;

      viewX =
        cx -
        imageX *
        newScale;

      viewY =
        cy -
        imageY *
        newScale;

      applyCanvasTransform();

      return;

    }


    const point =
      screenToImage(
        event.clientX,
        event.clientY
      );


    if (
      pointerMode === "crop"
    ) {

      cropEnd =
        clampPoint(
          point
        );

      updateCropOverlay();

      return;

    }


    if (
      pointerMode === "draw"
    ) {

      drawPreview(
        point
      );

      return;

    }


    if (
      pointerMode === "object" &&
      selectedObject
    ) {

      const dx =
        point.x -
        startPointer.x;

      const dy =
        point.y -
        startPointer.y;

      const original =
        startObjectState;


      if (
        selectedObject.type ===
        "arrow"
      ) {

        selectedObject.x1 =
          original.x1 +
          dx;

        selectedObject.y1 =
          original.y1 +
          dy;

        selectedObject.x2 =
          original.x2 +
          dx;

        selectedObject.y2 =
          original.y2 +
          dy;

      } else {

        selectedObject.x =
          original.x +
          dx;

        selectedObject.y =
          original.y +
          dy;

      }

      draw();

      return;

    }


    if (
      pointerMode === "pan"
    ) {

      if (!lastPointer) {

        lastPointer = {

          x:
            event.clientX,

          y:
            event.clientY

        };

        return;

      }

      viewX +=
        event.clientX -
        lastPointer.x;

      viewY +=
        event.clientY -
        lastPointer.y;

      lastPointer = {

        x:
          event.clientX,

        y:
          event.clientY

      };

      applyCanvasTransform();

    }

  }
);


/* =========================================================
   Pointer Up
========================================================= */

editor.addEventListener(
  "pointerup",
  event => {

    pointers.delete(
      event.pointerId
    );


    if (
      pointerMode ===
      "pinch"
    ) {

      if (
        pointers.size < 2
      ) {

        pointerMode = null;

      }

      return;

    }


    if (
      pointerMode ===
      "crop"
    ) {

      if (
        cropStart &&
        cropEnd
      ) {

        applyCrop();

      }

      pointerMode = null;

      return;

    }


    if (
      pointerMode ===
      "draw"
    ) {

      const point =
        screenToImage(
          event.clientX,
          event.clientY
        );

      finishDrawing(
        point
      );

      pointerMode = null;

      return;

    }


    if (
      pointerMode ===
      "object"
    ) {

      pointerMode = null;

      startPointer = null;

      startObjectState = null;

      draw();

      return;

    }


    if (
      pointerMode ===
      "pan"
    ) {

      pointerMode = null;

      lastPointer = null;

    }

  }
);


/* =========================================================
   Pointer Cancel
========================================================= */

editor.addEventListener(
  "pointercancel",
  event => {

    pointers.delete(
      event.pointerId
    );

    pointerMode = null;

  }
);


/* =========================================================
   Draw Preview
========================================================= */

function drawPreview(
  endPoint
) {

  draw();

  if (!startPointer) {

    return;

  }

  ctx.save();

  ctx.strokeStyle =
    colorInput.value;

  ctx.fillStyle =
    colorInput.value;

  /*
   * 円・四角・矢印
   * 線幅を前回の2倍に。
   */

  ctx.lineWidth =
    16;

  ctx.lineCap =
    "round";

  ctx.lineJoin =
    "round";


  if (
    currentTool ===
    "circle"
  ) {

    const radius =
      distance(
        startPointer,
        endPoint
      );

    ctx.beginPath();

    ctx.arc(
      startPointer.x,
      startPointer.y,
      radius,
      0,
      Math.PI * 2
    );

    ctx.stroke();

  }


  if (
    currentTool ===
    "rect"
  ) {

    const x =
      Math.min(
        startPointer.x,
        endPoint.x
      );

    const y =
      Math.min(
        startPointer.y,
        endPoint.y
      );

    const width =
      Math.abs(
        endPoint.x -
        startPointer.x
      );

    const height =
      Math.abs(
        endPoint.y -
        startPointer.y
      );

    ctx.strokeRect(
      x,
      y,
      width,
      height
    );

  }


  if (
    currentTool ===
    "arrow"
  ) {

    drawArrow(
      startPointer.x,
      startPointer.y,
      endPoint.x,
      endPoint.y,
      colorInput.value
    );

  }

  ctx.restore();

}


/* =========================================================
   Finish Drawing
========================================================= */

function finishDrawing(
  endPoint
) {

  if (!startPointer) {

    return;

  }

  let obj = null;


  if (
    currentTool ===
    "circle"
  ) {

    const radius =
      distance(
        startPointer,
        endPoint
      );

    if (
      radius > 5
    ) {

      obj = {

        type:
          "circle",

        x:
          startPointer.x,

        y:
          startPointer.y,

        radius,

        color:
          colorInput.value

      };

    }

  }


  if (
    currentTool ===
    "rect"
  ) {

    const width =
      Math.abs(
        endPoint.x -
        startPointer.x
      );

    const height =
      Math.abs(
        endPoint.y -
        startPointer.y
      );

    if (
      width > 5 &&
      height > 5
    ) {

      obj = {

        type:
          "rect",

        x:
          (
            startPointer.x +
            endPoint.x
          ) / 2,

        y:
          (
            startPointer.y +
            endPoint.y
          ) / 2,

        width,

        height,

        color:
          colorInput.value

      };

    }

  }


  if (
    currentTool ===
    "arrow"
  ) {

    if (
      distance(
        startPointer,
        endPoint
      ) > 10
    ) {

      obj = {

        type:
          "arrow",

        x1:
          startPointer.x,

        y1:
          startPointer.y,

        x2:
          endPoint.x,

        y2:
          endPoint.y,

        color:
          colorInput.value

      };

    }

  }


  if (obj) {

    objects.push(
      obj
    );

    selectedObject =
      obj;

  }


  currentTool = null;

  document
    .querySelectorAll(
      "[data-tool]"
    )
    .forEach(
      b =>
        b.classList.remove(
          "active"
        )
    );

  draw();

}


/* =========================================================
   Hit Test
========================================================= */

function hitTest(
  x,
  y
) {

  for (
    let i =
      objects.length - 1;
    i >= 0;
    i--
  ) {

    const o =
      objects[i];


    if (
      o.type ===
      "circle"
    ) {

      const d =
        distance(
          {
            x,
            y
          },
          {
            x: o.x,
            y: o.y
          }
        );

      if (
        d <=
        o.radius + 25
      ) {

        return o;

      }

    }


    if (
      o.type ===
      "rect"
    ) {

      const left =
        o.x -
        o.width / 2;

      const right =
        o.x +
        o.width / 2;

      const top =
        o.y -
        o.height / 2;

      const bottom =
        o.y +
        o.height / 2;

      if (
        x >= left &&
        x <= right &&
        y >= top &&
        y <= bottom
      ) {

        return o;

      }

    }


    if (
      o.type ===
      "arrow"
    ) {

      if (
        pointToLineDistance(
          x,
          y,
          o.x1,
          o.y1,
          o.x2,
          o.y2
        ) < 35
      ) {

        return o;

      }

    }


    if (
      o.type === "number" ||
      o.type === "letter"
    ) {

      const size =
        o.size || 70;

      if (
        x >=
          o.x - size &&
        x <=
          o.x + size &&
        y >=
          o.y - size &&
        y <=
          o.y + size
      ) {

        return o;

      }

    }

  }

  return null;

}


/* =========================================================
   Line Distance
========================================================= */

function pointToLineDistance(
  px,
  py,
  x1,
  y1,
  x2,
  y2
) {

  const A =
    px - x1;

  const B =
    py - y1;

  const C =
    x2 - x1;

  const D =
    y2 - y1;

  const dot =
    A * C +
    B * D;

  const length =
    C * C +
    D * D;

  let parameter =
    -1;

  if (
    length !== 0
  ) {

    parameter =
      dot /
      length;

  }

  let xx;
  let yy;


  if (
    parameter < 0
  ) {

    xx = x1;
    yy = y1;

  } else if (
    parameter > 1
  ) {

    xx = x2;
    yy = y2;

  } else {

    xx =
      x1 +
      parameter *
      C;

    yy =
      y1 +
      parameter *
      D;

  }

  const dx =
    px - xx;

  const dy =
    py - yy;

  return Math.sqrt(
    dx * dx +
    dy * dy
  );

}


/* =========================================================
   Draw
========================================================= */

function draw() {

  ctx.clearRect(
    0,
    0,
    canvas.width,
    canvas.height
  );

  if (image) {

    ctx.drawImage(
      image,
      0,
      0,
      canvas.width,
      canvas.height
    );

  }

  objects.forEach(
    drawObject
  );

}


/* =========================================================
   Draw Object
========================================================= */

function drawObject(
  o
) {

  ctx.save();


  if (
    o.type ===
    "circle"
  ) {

    ctx.strokeStyle =
      o.color ||
      "#00ff00";

    ctx.lineWidth =
      16;

    ctx.lineCap =
      "round";

    ctx.lineJoin =
      "round";

    ctx.beginPath();

    ctx.arc(
      o.x,
      o.y,
      o.radius,
      0,
      Math.PI * 2
    );

    ctx.stroke();

  }


  if (
    o.type ===
    "rect"
  ) {

    ctx.strokeStyle =
      o.color ||
      "#00ff00";

    ctx.lineWidth =
      16;

    ctx.lineCap =
      "round";

    ctx.lineJoin =
      "round";

    ctx.strokeRect(
      o.x -
        o.width / 2,

      o.y -
        o.height / 2,

      o.width,

      o.height
    );

  }


  if (
    o.type ===
    "arrow"
  ) {

    drawArrow(
      o.x1,
      o.y1,
      o.x2,
      o.y2,
      o.color
    );

  }


  if (
    o.type === "number" ||
    o.type === "letter"
  ) {

    drawMarker(o);

  }


  if (
    o ===
    selectedObject
  ) {

    drawSelection(o);

  }

  ctx.restore();

}


/* =========================================================
   Arrow
========================================================= */

function drawArrow(
  x1,
  y1,
  x2,
  y2,
  color
) {

  const dx =
    x2 - x1;

  const dy =
    y2 - y1;

  const angle =
    Math.atan2(
      dy,
      dx
    );

  const length =
    Math.sqrt(
      dx * dx +
      dy * dy
    );


  /*
   * 矢印先端の長さ。
   */

  const headLength =
    Math.min(
      55,
      Math.max(
        28,
        length * 0.17
      )
    );


  /*
   * 先端の三角形が始まる位置。
   *
   * 線はここまで。
   * そのため先端から線が
   * 飛び出さない。
   */

  const lineEndX =
    x2 -
    headLength *
    0.62 *
    Math.cos(
      angle
    );

  const lineEndY =
    y2 -
    headLength *
    0.62 *
    Math.sin(
      angle
    );


  ctx.save();

  ctx.strokeStyle =
    color ||
    "#00ff00";

  ctx.fillStyle =
    color ||
    "#00ff00";

  ctx.lineWidth =
    16;

  ctx.lineCap =
    "round";

  ctx.lineJoin =
    "round";


  /*
   * 本体の線。
   * 矢印先端より手前で止める。
   */

  ctx.beginPath();

  ctx.moveTo(
    x1,
    y1
  );

  ctx.lineTo(
    lineEndX,
    lineEndY
  );

  ctx.stroke();


  /*
   * 矢印の先端。
   */

  ctx.beginPath();

  ctx.moveTo(
    x2,
    y2
  );

  ctx.lineTo(
    x2 -
      headLength *
      Math.cos(
        angle -
        Math.PI / 6
      ),

    y2 -
      headLength *
      Math.sin(
        angle -
        Math.PI / 6
      )
  );

  ctx.lineTo(
    x2 -
      headLength *
      Math.cos(
        angle +
        Math.PI / 6
      ),

    y2 -
      headLength *
      Math.sin(
        angle +
        Math.PI / 6
      )
  );

  ctx.closePath();

  ctx.fill();

  ctx.restore();

}


/* =========================================================
   Marker
========================================================= */

function drawMarker(
  o
) {

  const size =
    o.size || 70;

  const radius =
    size * 0.68;


  ctx.fillStyle =
    "#ffffff";

  ctx.beginPath();

  ctx.arc(
    o.x,
    o.y,
    radius,
    0,
    Math.PI * 2
  );

  ctx.fill();


  ctx.fillStyle =
    "#000000";

  ctx.font =
    `bold ${size * 0.72}px sans-serif`;

  ctx.textAlign =
    "center";

  ctx.textBaseline =
    "middle";

  ctx.fillText(
    o.text,
    o.x,
    o.y
  );

}


/* =========================================================
   Selection
========================================================= */

function drawSelection(
  o
) {

  ctx.save();

  ctx.strokeStyle =
    "#5865f2";

  ctx.lineWidth =
    3;

  ctx.setLineDash(
    [10,8]
  );


  if (
    o.type ===
    "circle"
  ) {

    ctx.beginPath();

    ctx.arc(
      o.x,
      o.y,
      o.radius + 12,
      0,
      Math.PI * 2
    );

    ctx.stroke();

  }


  if (
    o.type ===
    "rect"
  ) {

    ctx.strokeRect(
      o.x -
        o.width / 2 -
        10,

      o.y -
        o.height / 2 -
        10,

      o.width + 20,

      o.height + 20
    );

  }


  if (
    o.type ===
    "arrow"
  ) {

    ctx.beginPath();

    ctx.moveTo(
      o.x1,
      o.y1
    );

    ctx.lineTo(
      o.x2,
      o.y2
    );

    ctx.stroke();

  }


  if (
    o.type === "number" ||
    o.type === "letter"
  ) {

    const size =
      o.size || 70;

    ctx.strokeRect(
      o.x - size,
      o.y - size,
      size * 2,
      size * 2
    );

  }

  ctx.restore();

}


/* =========================================================
   Delete
========================================================= */

deleteButton.addEventListener(
  "click",
  () => {

    if (!selectedObject) {

      return;

    }

    saveHistory();

    objects =
      objects.filter(
        o =>
          o !==
          selectedObject
      );

    selectedObject = null;

    draw();

  }
);


/* =========================================================
   Clear
========================================================= */

clearButton.addEventListener(
  "click",
  () => {

    if (!objects.length) {

      return;

    }

    saveHistory();

    objects = [];

    selectedObject = null;

    numberIndex = 0;

    letterIndex = 0;

    draw();

  }
);


/* =========================================================
   Crop
========================================================= */

function applyCrop() {

  if (
    !cropStart ||
    !cropEnd
  ) {

    return;

  }


  const x =
    Math.max(
      0,
      Math.min(
        cropStart.x,
        cropEnd.x
      )
    );

  const y =
    Math.max(
      0,
      Math.min(
        cropStart.y,
        cropEnd.y
      )
    );

  const right =
    Math.min(
      canvas.width,
      Math.max(
        cropStart.x,
        cropEnd.x
      )
    );

  const bottom =
    Math.min(
      canvas.height,
      Math.max(
        cropStart.y,
        cropEnd.y
      )
    );

  const width =
    right - x;

  const height =
    bottom - y;


  if (
    width < 10 ||
    height < 10
  ) {

    cropStart = null;

    cropEnd = null;

    cropOverlay.style.display =
      "none";

    return;

  }


  saveHistory();


  const tempCanvas =
    document.createElement(
      "canvas"
    );

  tempCanvas.width =
    width;

  tempCanvas.height =
    height;

  const tempCtx =
    tempCanvas.getContext(
      "2d"
    );


  tempCtx.drawImage(
    canvas,

    x,
    y,
    width,
    height,

    0,
    0,
    width,
    height
  );


  const cropped =
    new Image();

  cropped.onload =
    () => {

      image =
        cropped;

      canvas.width =
        width;

      canvas.height =
        height;

      objects = [];

      selectedObject = null;

      cropMode = false;

      cropButton.classList.remove(
        "active"
      );

      cropStart = null;

      cropEnd = null;

      cropOverlay.style.display =
        "none";

      fitImage();

      draw();

    };

  cropped.src =
    tempCanvas.toDataURL(
      "image/png"
    );

}


/* =========================================================
   Crop Overlay
========================================================= */

function updateCropOverlay() {

  if (
    !cropMode ||
    !cropStart ||
    !cropEnd
  ) {

    cropOverlay.style.display =
      "none";

    return;

  }

  const a =
    imageToScreen(
      cropStart.x,
      cropStart.y
    );

  const b =
    imageToScreen(
      cropEnd.x,
      cropEnd.y
    );

  const rect =
    editor.getBoundingClientRect();

  const left =
    Math.min(
      a.x,
      b.x
    );

  const top =
    Math.min(
      a.y,
      b.y
    );

  const width =
    Math.abs(
      b.x -
      a.x
    );

  const height =
    Math.abs(
      b.y -
      a.y
    );

  cropOverlay.style.left =
    `${left -
      rect.left}px`;

  cropOverlay.style.top =
    `${top -
      rect.top}px`;

  cropOverlay.style.width =
    `${width}px`;

  cropOverlay.style.height =
    `${height}px`;

  cropOverlay.style.display =
    "block";

}


/* =========================================================
   Save
========================================================= */

saveButton.addEventListener(
  "click",
  event => {

    event.stopPropagation();

    if (!image) {

      return;

    }

    selectedObject = null;

    draw();

    canvas.toBlob(
      blob => {

        if (!blob) {

          return;

        }

        const url =
          URL.createObjectURL(
            blob
          );

        const a =
          document.createElement(
            "a"
          );

        a.href =
          url;

        a.download =
          `S222-image-${Date.now()}.png`;

        document.body.appendChild(
          a
        );

        a.click();

        a.remove();

        URL.revokeObjectURL(
          url
        );

      },
      "image/png"
    );

  }
);


/* =========================================================
   Helpers
========================================================= */

function distance(
  a,
  b
) {

  const dx =
    b.x - a.x;

  const dy =
    b.y - a.y;

  return Math.sqrt(
    dx * dx +
    dy * dy
  );

}


function midpoint(
  a,
  b
) {

  return {

    x:
      (a.x + b.x) / 2,

    y:
      (a.y + b.y) / 2

  };

}


function clampPoint(
  p
) {

  return {

    x:
      Math.max(
        0,
        Math.min(
          canvas.width,
          p.x
        )
      ),

    y:
      Math.max(
        0,
        Math.min(
          canvas.height,
          p.y
        )
      )

  };

}


/* =========================================================
   Resize
========================================================= */

window.addEventListener(
  "resize",
  () => {

    if (!image) {

      return;

    }

    applyCanvasTransform();

  }
);

</script>
