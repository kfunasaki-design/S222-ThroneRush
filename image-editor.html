<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

<title>S222 Image Editor</title>

<style>
* {
  box-sizing: border-box;
}

html,
body {
  margin: 0;
  padding: 0;
  width: 100%;
  height: 100%;
  overflow: hidden;
  background: #111214;
  color: #dcddde;
  font-family:
    -apple-system,
    BlinkMacSystemFont,
    "Segoe UI",
    sans-serif;
}

body {
  display: flex;
  flex-direction: column;
}

/* =========================================================
   Header
========================================================= */

.header {
  height: 52px;
  flex-shrink: 0;
  background: #1e1f22;
  border-bottom: 1px solid #2b2d31;

  display: flex;
  align-items: center;
  justify-content: space-between;

  padding: 0 14px;
}

.title {
  font-size: 15px;
  font-weight: 700;
  color: #fff;
}

.subtitle {
  font-size: 11px;
  color: #949ba4;
}

/* =========================================================
   Toolbar
========================================================= */

.toolbar {
  min-height: 54px;
  flex-shrink: 0;

  background: #2b2d31;
  border-bottom: 1px solid #18191c;

  display: flex;
  align-items: center;

  gap: 7px;
  padding: 7px 10px;

  overflow-x: auto;
  overflow-y: hidden;

  -webkit-overflow-scrolling: touch;
}

.toolbar::-webkit-scrollbar {
  display: none;
}

.tool-group {
  display: flex;
  gap: 5px;
  flex-shrink: 0;
}

button {
  border: none;
  border-radius: 6px;

  background: #404249;
  color: #dcddde;

  padding: 8px 10px;

  font-size: 13px;
  font-weight: 600;

  white-space: nowrap;

  cursor: pointer;
}

button:hover {
  background: #4a4c53;
}

button:active {
  transform: scale(0.97);
}

button.active {
  background: #5865f2;
  color: #fff;
}

button.primary {
  background: #5865f2;
  color: #fff;
}

button.danger {
  background: #ed4245;
  color: #fff;
}

input[type="color"] {
  width: 34px;
  height: 34px;

  padding: 2px;

  border: none;
  border-radius: 6px;

  background: #404249;

  cursor: pointer;
}

/* =========================================================
   Editor Area
========================================================= */

.editor {
  flex: 1;
  min-height: 0;

  background: #111214;

  display: flex;
  align-items: center;
  justify-content: center;

  position: relative;

  overflow: hidden;
}

.canvas-wrapper {
  position: relative;

  max-width: 96%;
  max-height: 90%;

  display: flex;
  align-items: center;
  justify-content: center;
}

#canvas {
  display: block;

  max-width: 100%;
  max-height: 100%;

  background: #1e1f22;

  touch-action: none;
}

/* =========================================================
   Empty State
========================================================= */

.empty {
  position: absolute;

  left: 50%;
  top: 50%;

  transform: translate(-50%, -50%);

  text-align: center;

  color: #72767d;

  pointer-events: none;
}

.empty-title {
  font-size: 18px;
  font-weight: 700;

  margin-bottom: 7px;
}

.empty-text {
  font-size: 12px;
}

/* =========================================================
   Crop Overlay
========================================================= */

.crop-overlay {
  position: absolute;

  border: 2px dashed #fff;

  background: rgba(255,255,255,0.08);

  pointer-events: none;

  display: none;
}

.crop-handle {
  position: absolute;

  width: 12px;
  height: 12px;

  background: #fff;

  border: 2px solid #5865f2;

  border-radius: 50%;
}

.crop-handle.tl {
  left: -7px;
  top: -7px;
}

.crop-handle.tr {
  right: -7px;
  top: -7px;
}

.crop-handle.bl {
  left: -7px;
  bottom: -7px;
}

.crop-handle.br {
  right: -7px;
  bottom: -7px;
}

/* =========================================================
   Bottom Info
========================================================= */

.status {
  height: 32px;
  flex-shrink: 0;

  background: #1e1f22;

  border-top: 1px solid #2b2d31;

  display: flex;
  align-items: center;

  padding: 0 10px;

  font-size: 11px;

  color: #949ba4;
}

/* =========================================================
   File Input
========================================================= */

#fileInput {
  display: none;
}

/* =========================================================
   Mobile
========================================================= */

@media (max-width: 600px) {

  .header {
    height: 48px;
    padding: 0 10px;
  }

  .title {
    font-size: 14px;
  }

  .subtitle {
    display: none;
  }

  .toolbar {
    min-height: 52px;
    padding: 6px;
  }

  button {
    padding: 8px 9px;
    font-size: 12px;
  }

  .editor {
    align-items: center;
  }
}
</style>
</head>

<body>

<!-- =========================================================
     Header
========================================================= -->

<header class="header">

  <div>
    <div class="title">
      S222 Image Editor
    </div>

    <div class="subtitle">
      Simple Strategy Image Tool
    </div>
  </div>

  <button
    id="saveButton"
    class="primary">
    保存
  </button>

</header>


<!-- =========================================================
     Toolbar
========================================================= -->

<div class="toolbar">

  <div class="tool-group">

    <label for="fileInput">
      <button type="button"
              onclick="document.getElementById('fileInput').click()">
        画像
      </button>
    </label>

    <button id="cropButton">
      ✂ 切り抜き
    </button>

  </div>


  <div class="tool-group">

    <button data-tool="circle">
      ⭕ 円
    </button>

    <button data-tool="rect">
      ▭ 四角
    </button>

    <button data-tool="arrow">
      ➜ 矢印
    </button>

  </div>


  <div class="tool-group">

    <button data-tool="number">
      ①〜⑤
    </button>

    <button data-tool="letter">
      A〜E
    </button>

  </div>


  <div class="tool-group">

    <input
      id="colorInput"
      type="color"
      value="#ff0000"
      title="色">

    <button id="deleteButton">
      削除
    </button>

    <button id="clearButton">
      全消去
    </button>

  </div>

</div>


<!-- =========================================================
     Editor
========================================================= -->

<main class="editor">

  <div
    id="canvasWrapper"
    class="canvas-wrapper">

    <canvas id="canvas"></canvas>

    <div
      id="cropOverlay"
      class="crop-overlay">

      <div class="crop-handle tl"></div>
      <div class="crop-handle tr"></div>
      <div class="crop-handle bl"></div>
      <div class="crop-handle br"></div>

    </div>

  </div>


  <div
    id="emptyState"
    class="empty">

    <div class="empty-title">
      画像を読み込んでください
    </div>

    <div class="empty-text">
      スクリーンショットを加工できます
    </div>

  </div>

</main>


<!-- =========================================================
     Status
========================================================= -->

<div
  id="status"
  class="status">

  画像未読み込み

</div>


<input
  id="fileInput"
  type="file"
  accept="image/*">


<script>

/* =========================================================
   State
========================================================= */

const canvas =
  document.getElementById("canvas");

const ctx =
  canvas.getContext("2d");

const wrapper =
  document.getElementById("canvasWrapper");

const emptyState =
  document.getElementById("emptyState");

const status =
  document.getElementById("status");

const fileInput =
  document.getElementById("fileInput");

const cropButton =
  document.getElementById("cropButton");

const colorInput =
  document.getElementById("colorInput");

const deleteButton =
  document.getElementById("deleteButton");

const clearButton =
  document.getElementById("clearButton");

const saveButton =
  document.getElementById("saveButton");

const cropOverlay =
  document.getElementById("cropOverlay");


let image = null;

let objects = [];

let selectedObject = null;

let currentTool = null;

let numberCount = 1;

let letterCount = 0;


/* =========================================================
   Image Load
========================================================= */

fileInput.addEventListener(
  "change",
  event => {

    const file =
      event.target.files[0];

    if (!file) return;

    const reader =
      new FileReader();

    reader.onload = e => {

      const img =
        new Image();

      img.onload = () => {

        image = img;

        objects = [];

        selectedObject = null;

        numberCount = 1;

        letterCount = 0;

        canvas.width =
          img.naturalWidth;

        canvas.height =
          img.naturalHeight;

        emptyState.style.display =
          "none";

        status.textContent =
          `${canvas.width} × ${canvas.height}`;

        draw();

      };

      img.src = e.target.result;

    };

    reader.readAsDataURL(file);

  }
);


/* =========================================================
   Tool Selection
========================================================= */

document
  .querySelectorAll("[data-tool]")
  .forEach(button => {

    button.addEventListener(
      "click",
      () => {

        if (!image) return;

        currentTool =
          button.dataset.tool;

        document
          .querySelectorAll("[data-tool]")
          .forEach(b =>
            b.classList.remove("active")
          );

        button.classList.add("active");

        cropButton.classList.remove(
          "active"
        );

        status.textContent =
          `ツール：${currentTool}`;

      }
    );

  });


/* =========================================================
   Color
========================================================= */

colorInput.addEventListener(
  "input",
  () => {

    if (
      selectedObject &&
      selectedObject.type !== "number" &&
      selectedObject.type !== "letter"
    ) {

      selectedObject.color =
        colorInput.value;

      draw();

    }

  }
);


/* =========================================================
   Pointer Helpers
========================================================= */

function getPointer(event) {

  const rect =
    canvas.getBoundingClientRect();

  const scaleX =
    canvas.width / rect.width;

  const scaleY =
    canvas.height / rect.height;

  let clientX;
  let clientY;

  if (
    event.touches &&
    event.touches.length
  ) {

    clientX =
      event.touches[0].clientX;

    clientY =
      event.touches[0].clientY;

  } else {

    clientX =
      event.clientX;

    clientY =
      event.clientY;

  }

  return {

    x:
      (clientX - rect.left) *
      scaleX,

    y:
      (clientY - rect.top) *
      scaleY

  };

}


/* =========================================================
   Object Hit Test
========================================================= */

function hitTest(x, y) {

  for (
    let i = objects.length - 1;
    i >= 0;
    i--
  ) {

    const o =
      objects[i];

    if (o.type === "circle") {

      const dx =
        x - o.x;

      const dy =
        y - o.y;

      if (
        Math.sqrt(
          dx * dx +
          dy * dy
        ) <= o.radius + 15
      ) {

        return o;

      }

    }

    if (o.type === "rect") {

      if (
        x >= o.x - o.width / 2 - 15 &&
        x <= o.x + o.width / 2 + 15 &&
        y >= o.y - o.height / 2 - 15 &&
        y <= o.y + o.height / 2 + 15
      ) {

        return o;

      }

    }

    if (o.type === "number" ||
        o.type === "letter") {

      const size =
        o.size || 70;

      if (
        x >= o.x - size &&
        x <= o.x + size &&
        y >= o.y - size &&
        y <= o.y + size
      ) {

        return o;

      }

    }

    if (o.type === "arrow") {

      const distance =
        pointToLineDistance(
          x,
          y,
          o.x1,
          o.y1,
          o.x2,
          o.y2
        );

      if (distance < 25) {

        return o;

      }

    }

  }

  return null;

}


/* =========================================================
   Line Distance
========================================================= */

function pointToLineDistance(
  px,
  py,
  x1,
  y1,
  x2,
  y2
) {

  const A =
    px - x1;

  const B =
    py - y1;

  const C =
    x2 - x1;

  const D =
    y2 - y1;

  const dot =
    A * C +
    B * D;

  const lenSq =
    C * C +
    D * D;

  let param =
    -1;

  if (lenSq !== 0) {

    param =
      dot / lenSq;

  }

  let xx;
  let yy;

  if (param < 0) {

    xx = x1;
    yy = y1;

  } else if (param > 1) {

    xx = x2;
    yy = y2;

  } else {

    xx =
      x1 + param * C;

    yy =
      y1 + param * D;

  }

  const dx =
    px - xx;

  const dy =
    py - yy;

  return Math.sqrt(
    dx * dx +
    dy * dy
  );

}


/* =========================================================
   Pointer State
========================================================= */

let dragging = false;

let dragStart = null;

let dragObject = null;

let resizeStart = null;


/* =========================================================
   Pointer Down
========================================================= */

canvas.addEventListener(
  "pointerdown",
  event => {

    if (!image) return;

    const p =
      getPointer(event);

    canvas.setPointerCapture(
      event.pointerId
    );


    /* -----------------------------------------
       Drawing Tools
    ----------------------------------------- */

    if (currentTool) {

      if (
        currentTool === "number" ||
        currentTool === "letter"
      ) {

        let text;

        if (
          currentTool === "number"
        ) {

          text =
            ["①","②","③","④","⑤"]
              [numberCount - 1];

          if (!text) {

            currentTool = null;

            return;

          }

          numberCount++;

        } else {

          text =
            String.fromCharCode(
              65 + letterCount
            );

          if (letterCount >= 5) {

            currentTool = null;

            return;

          }

          letterCount++;

        }

        const obj = {

          type:
            currentTool,

          x:
            p.x,

          y:
            p.y,

          text,

          size:
            70

        };

        objects.push(obj);

        selectedObject =
          obj;

        draw();

        return;

      }


      dragging = true;

      dragStart = p;

      return;

    }


    /* -----------------------------------------
       Select Existing Object
    ----------------------------------------- */

    const hit =
      hitTest(
        p.x,
        p.y
      );

    if (hit) {

      selectedObject =
        hit;

      dragObject =
        hit;

      dragging = true;

      dragStart = p;

      resizeStart = {

        x:
          hit.x,

        y:
          hit.y

      };

      draw();

      return;

    }

    selectedObject = null;

    draw();

  }
);


/* =========================================================
   Pointer Move
========================================================= */

canvas.addEventListener(
  "pointermove",
  event => {

    if (!dragging) return;

    const p =
      getPointer(event);


    /* -----------------------------------------
       Drawing
    ----------------------------------------- */

    if (
      currentTool &&
      dragStart
    ) {

      if (
        currentTool === "circle"
      ) {

        selectedObject = {

          type:
            "circle",

          x:
            dragStart.x,

          y:
            dragStart.y,

          radius:
            Math.sqrt(
              Math.pow(
                p.x -
                dragStart.x,
                2
              ) +
              Math.pow(
                p.y -
                dragStart.y,
                2
              )
            ),

          color:
            colorInput.value

        };

        drawPreview();

        return;

      }


      if (
        currentTool === "rect"
      ) {

        selectedObject = {

          type:
            "rect",

          x:
            (dragStart.x + p.x) / 2,

          y:
            (dragStart.y + p.y) / 2,

          width:
            Math.abs(
              p.x -
              dragStart.x
            ),

          height:
            Math.abs(
              p.y -
              dragStart.y
            ),

          color:
            colorInput.value

        };

        drawPreview();

        return;

      }


      if (
        currentTool === "arrow"
      ) {

        selectedObject = {

          type:
            "arrow",

          x1:
            dragStart.x,

          y1:
            dragStart.y,

          x2:
            p.x,

          y2:
            p.y,

          color:
            colorInput.value

        };

        drawPreview();

        return;

      }

    }


    /* -----------------------------------------
       Move Existing Object
    ----------------------------------------- */

    if (
      dragObject &&
      !currentTool
    ) {

      const dx =
        p.x -
        dragStart.x;

      const dy =
        p.y -
        dragStart.y;

      if (
        dragObject.type === "arrow"
      ) {

        dragObject.x1 =
          resizeStart.x1 + dx;

        dragObject.y1 =
          resizeStart.y1 + dy;

        dragObject.x2 =
          resizeStart.x2 + dx;

        dragObject.y2 =
          resizeStart.y2 + dy;

      } else {

        dragObject.x =
          resizeStart.x + dx;

        dragObject.y =
          resizeStart.y + dy;

      }

      draw();

    }

  }
);


/* =========================================================
   Pointer Up
========================================================= */

canvas.addEventListener(
  "pointerup",
  event => {

    if (!dragging) return;

    const p =
      getPointer(event);


    /* -----------------------------------------
       Finish Drawing
    ----------------------------------------- */

    if (
      currentTool &&
      dragStart
    ) {

      let obj = null;


      if (
        currentTool === "circle"
      ) {

        obj = {

          type:
            "circle",

          x:
            dragStart.x,

          y:
            dragStart.y,

          radius:
            Math.sqrt(
              Math.pow(
                p.x -
                dragStart.x,
                2
              ) +
              Math.pow(
                p.y -
                dragStart.y,
                2
              )
            ),

          color:
            colorInput.value

        };

      }


      if (
        currentTool === "rect"
      ) {

        obj = {

          type:
            "rect",

          x:
            (dragStart.x + p.x) / 2,

          y:
            (dragStart.y + p.y) / 2,

          width:
            Math.abs(
              p.x -
              dragStart.x
            ),

          height:
            Math.abs(
              p.y -
              dragStart.y
            ),

          color:
            colorInput.value

        };

      }


      if (
        currentTool === "arrow"
      ) {

        obj = {

          type:
            "arrow",

          x1:
            dragStart.x,

          y1:
            dragStart.y,

          x2:
            p.x,

          y2:
            p.y,

          color:
            colorInput.value

        };

      }


      if (obj) {

        objects.push(obj);

        selectedObject =
          obj;

      }

      currentTool = null;

      document
        .querySelectorAll(
          "[data-tool]"
        )
        .forEach(
          b =>
            b.classList.remove(
              "active"
            )
        );

    }


    dragging = false;

    dragStart = null;

    dragObject = null;

    resizeStart = null;

    draw();

  }
);


/* =========================================================
   Drawing
========================================================= */

function draw() {

  ctx.clearRect(
    0,
    0,
    canvas.width,
    canvas.height
  );

  if (image) {

    ctx.drawImage(
      image,
      0,
      0,
      canvas.width,
      canvas.height
    );

  }


  objects.forEach(
    drawObject
  );

}


/* =========================================================
   Preview
========================================================= */

function drawPreview() {

  draw();

  if (selectedObject) {

    drawObject(
      selectedObject
    );

  }

}


/* =========================================================
   Draw Object
========================================================= */

function drawObject(o) {

  ctx.save();


  /* -----------------------------------------
     Circle
  ----------------------------------------- */

  if (o.type === "circle") {

    ctx.strokeStyle =
      o.color || "#ff0000";

    ctx.lineWidth =
      8;

    ctx.beginPath();

    ctx.arc(
      o.x,
      o.y,
      o.radius,
      0,
      Math.PI * 2
    );

    ctx.stroke();

  }


  /* -----------------------------------------
     Rectangle
  ----------------------------------------- */

  if (o.type === "rect") {

    ctx.strokeStyle =
      o.color || "#ff0000";

    ctx.lineWidth =
      8;

    ctx.strokeRect(
      o.x -
        o.width / 2,

      o.y -
        o.height / 2,

      o.width,
      o.height
    );

  }


  /* -----------------------------------------
     Arrow
  ----------------------------------------- */

  if (o.type === "arrow") {

    drawArrow(o);

  }


  /* -----------------------------------------
     Number / Letter
  ----------------------------------------- */

  if (
    o.type === "number" ||
    o.type === "letter"
  ) {

    drawMarker(o);

  }


  /* -----------------------------------------
     Selection
  ----------------------------------------- */

  if (
    o === selectedObject
  ) {

    drawSelection(o);

  }

  ctx.restore();

}


/* =========================================================
   Arrow
========================================================= */

function drawArrow(o) {

  const dx =
    o.x2 - o.x1;

  const dy =
    o.y2 - o.y1;

  const angle =
    Math.atan2(
      dy,
      dx
    );

  const length =
    Math.sqrt(
      dx * dx +
      dy * dy
    );

  const headLength =
    Math.min(
      45,
      Math.max(
        24,
        length * 0.15
      )
    );

  ctx.strokeStyle =
    o.color || "#ff0000";

  ctx.fillStyle =
    o.color || "#ff0000";

  ctx.lineWidth =
    10;

  ctx.lineCap =
    "round";

  ctx.lineJoin =
    "round";

  /* Shadow */

  ctx.shadowColor =
    "rgba(0,0,0,0.75)";

  ctx.shadowBlur =
    8;

  ctx.beginPath();

  ctx.moveTo(
    o.x1,
    o.y1
  );

  ctx.lineTo(
    o.x2,
    o.y2
  );

  ctx.stroke();

  ctx.shadowBlur = 0;


  /* Arrow head */

  ctx.beginPath();

  ctx.moveTo(
    o.x2,
    o.y2
  );

  ctx.lineTo(
    o.x2 -
      headLength *
      Math.cos(
        angle -
        Math.PI / 6
      ),

    o.y2 -
      headLength *
      Math.sin(
        angle -
        Math.PI / 6
      )
  );

  ctx.lineTo(
    o.x2 -
      headLength *
      Math.cos(
        angle +
        Math.PI / 6
      ),

    o.y2 -
      headLength *
      Math.sin(
        angle +
        Math.PI / 6
      )
  );

  ctx.closePath();

  ctx.fill();

}


/* =========================================================
   Marker
========================================================= */

function drawMarker(o) {

  const size =
    o.size || 70;

  const radius =
    size * 0.65;

  /* White circle */

  ctx.fillStyle =
    "#ffffff";

  ctx.beginPath();

  ctx.arc(
    o.x,
    o.y,
    radius,
    0,
    Math.PI * 2
  );

  ctx.fill();


  /* Black text */

  ctx.fillStyle =
    "#000000";

  ctx.font =
    `bold ${size * 0.75}px sans-serif`;

  ctx.textAlign =
    "center";

  ctx.textBaseline =
    "middle";

  ctx.fillText(
    o.text,
    o.x,
    o.y
  );

}


/* =========================================================
   Selection
========================================================= */

function drawSelection(o) {

  ctx.strokeStyle =
    "rgba(88,101,242,0.9)";

  ctx.lineWidth =
    3;

  ctx.setLineDash(
    [10, 8]
  );


  if (
    o.type === "circle"
  ) {

    ctx.beginPath();

    ctx.arc(
      o.x,
      o.y,
      o.radius + 12,
      0,
      Math.PI * 2
    );

    ctx.stroke();

  }


  if (
    o.type === "rect"
  ) {

    ctx.strokeRect(
      o.x -
        o.width / 2 -
        10,

      o.y -
        o.height / 2 -
        10,

      o.width + 20,

      o.height + 20
    );

  }


  if (
    o.type === "arrow"
  ) {

    ctx.beginPath();

    ctx.moveTo(
      o.x1,
      o.y1
    );

    ctx.lineTo(
      o.x2,
      o.y2
    );

    ctx.stroke();

  }


  if (
    o.type === "number" ||
    o.type === "letter"
  ) {

    const size =
      o.size || 70;

    ctx.strokeRect(
      o.x -
        size,

      o.y -
        size,

      size * 2,

      size * 2
    );

  }

  ctx.setLineDash([]);

}


/* =========================================================
   Delete
========================================================= */

deleteButton.addEventListener(
  "click",
  () => {

    if (!selectedObject) return;

    objects =
      objects.filter(
        o =>
          o !== selectedObject
      );

    selectedObject =
      null;

    draw();

  }
);


/* =========================================================
   Clear
========================================================= */

clearButton.addEventListener(
  "click",
  () => {

    if (!image) return;

    if (
      !confirm(
        "配置したオブジェクトをすべて削除しますか？"
      )
    ) {

      return;

    }

    objects = [];

    selectedObject =
      null;

    numberCount = 1;

    letterCount = 0;

    draw();

  }
);


/* =========================================================
   Crop Mode
========================================================= */

let cropMode = false;

let cropStart = null;

let cropEnd = null;

cropButton.addEventListener(
  "click",
  () => {

    if (!image) return;

    cropMode =
      !cropMode;

    cropButton.classList.toggle(
      "active",
      cropMode
    );

    if (cropMode) {

      currentTool = null;

      document
        .querySelectorAll(
          "[data-tool]"
        )
        .forEach(
          b =>
            b.classList.remove(
              "active"
            )
        );

      status.textContent =
        "切り抜く範囲をドラッグしてください";

    } else {

      cropOverlay.style.display =
        "none";

      status.textContent =
        `${canvas.width} × ${canvas.height}`;

    }

  }
);


/* =========================================================
   Crop Pointer
========================================================= */

canvas.addEventListener(
  "pointerdown",
  event => {

    if (!cropMode) return;

    const p =
      getPointer(event);

    cropStart =
      p;

    cropEnd =
      p;

    cropOverlay.style.display =
      "block";

    updateCropOverlay();

  }
);


canvas.addEventListener(
  "pointermove",
  event => {

    if (
      !cropMode ||
      !cropStart
    ) {

      return;

    }

    cropEnd =
      getPointer(event);

    updateCropOverlay();

  }
);


canvas.addEventListener(
  "pointerup",
  event => {

    if (
      !cropMode ||
      !cropStart
    ) {

      return;

    }

    cropEnd =
      getPointer(event);

    applyCrop();

  }
);


/* =========================================================
   Crop Overlay
========================================================= */

function updateCropOverlay() {

  if (
    !cropStart ||
    !cropEnd
  ) {

    return;

  }

  const rect =
    canvas.getBoundingClientRect();

  const scaleX =
    rect.width /
    canvas.width;

  const scaleY =
    rect.height /
    canvas.height;

  const x =
    Math.min(
      cropStart.x,
      cropEnd.x
    );

  const y =
    Math.min(
      cropStart.y,
      cropEnd.y
    );

  const width =
    Math.abs(
      cropEnd.x -
      cropStart.x
    );

  const height =
    Math.abs(
      cropEnd.y -
      cropStart.y
    );

  cropOverlay.style.left =
    `${x * scaleX}px`;

  cropOverlay.style.top =
    `${y * scaleY}px`;

  cropOverlay.style.width =
    `${width * scaleX}px`;

  cropOverlay.style.height =
    `${height * scaleY}px`;

}


/* =========================================================
   Apply Crop
========================================================= */

function applyCrop() {

  const x =
    Math.max(
      0,
      Math.min(
        cropStart.x,
        cropEnd.x
      )
    );

  const y =
    Math.max(
      0,
      Math.min(
        cropStart.y,
        cropEnd.y
      )
    );

  const width =
    Math.min(
      canvas.width - x,
      Math.abs(
        cropEnd.x -
        cropStart.x
      )
    );

  const height =
    Math.min(
      canvas.height - y,
      Math.abs(
        cropEnd.y -
        cropStart.y
      )
    );


  if (
    width < 10 ||
    height < 10
  ) {

    cropStart = null;
    cropEnd = null;

    cropOverlay.style.display =
      "none";

    return;

  }


  /* -----------------------------------------
     Create Cropped Image
  ----------------------------------------- */

  const tempCanvas =
    document.createElement(
      "canvas"
    );

  tempCanvas.width =
    width;

  tempCanvas.height =
    height;

  const tempCtx =
    tempCanvas.getContext(
      "2d"
    );

  tempCtx.drawImage(
    canvas,

    x,
    y,
    width,
    height,

    0,
    0,
    width,
    height
  );


  /* -----------------------------------------
     Replace Image
  ----------------------------------------- */

  const croppedImage =
    new Image();

  croppedImage.onload =
    () => {

      image =
        croppedImage;

      canvas.width =
        width;

      canvas.height =
        height;

      /*
       * 現在配置されているオブジェクトは
       * 切り抜き範囲に合わせて座標を移動。
       */

      objects.forEach(
        o => {

          if (
            o.type === "arrow"
          ) {

            o.x1 -= x;
            o.y1 -= y;

            o.x2 -= x;
            o.y2 -= y;

          } else {

            o.x -= x;
            o.y -= y;

          }

        }
      );


      objects =
        objects.filter(
          o =>
            objectIsInsideCanvas(
              o
            )
        );


      selectedObject =
        null;

      cropStart = null;

      cropEnd = null;

      cropOverlay.style.display =
        "none";

      cropMode = false;

      cropButton.classList.remove(
        "active"
      );

      status.textContent =
        `${width} × ${height}`;

      draw();

    };

  croppedImage.src =
    tempCanvas.toDataURL(
      "image/png"
    );

}


/* =========================================================
   Object Visibility After Crop
========================================================= */

function objectIsInsideCanvas(o) {

  if (
    o.type === "arrow"
  ) {

    return (
      (
        o.x1 >= 0 &&
        o.x1 <= canvas.width &&
        o.y1 >= 0 &&
        o.y1 <= canvas.height
      ) ||
      (
        o.x2 >= 0 &&
        o.x2 <= canvas.width &&
        o.y2 >= 0 &&
        o.y2 <= canvas.height
      )
    );

  }


  return (
    o.x >= -100 &&
    o.x <= canvas.width + 100 &&
    o.y >= -100 &&
    o.y <= canvas.height + 100
  );

}


/* =========================================================
   Save PNG
========================================================= */

saveButton.addEventListener(
  "click",
  () => {

    if (!image) return;

    selectedObject =
      null;

    draw();

    canvas.toBlob(
      blob => {

        if (!blob) return;

        const url =
          URL.createObjectURL(
            blob
          );

        const a =
          document.createElement(
            "a"
          );

        a.href =
          url;

        a.download =
          `S222-image-${Date.now()}.png`;

        document.body.appendChild(
          a
        );

        a.click();

        a.remove();

        URL.revokeObjectURL(
          url
        );

      },
      "image/png"
    );

  }
);


/* =========================================================
   Initial
========================================================= */

status.textContent =
  "画像未読み込み";

</script>

</body>
</html>
