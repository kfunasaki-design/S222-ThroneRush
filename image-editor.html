<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width,
           initial-scale=1.0,
           maximum-scale=1.0,
           user-scalable=no">

<title>S222 Image Editor</title>

<style>

* {
  box-sizing: border-box;
}

html,
body {
  width: 100%;
  height: 100%;
  margin: 0;
  padding: 0;

  overflow: hidden;

  background: #111214;
  color: #dcddde;

  font-family:
    -apple-system,
    BlinkMacSystemFont,
    "Segoe UI",
    sans-serif;
}

/* =========================================================
   App
========================================================= */

#app {
  width: 100%;
  height: 100%;

  display: flex;
  flex-direction: column;

  background: #111214;
}


/* =========================================================
   Header
========================================================= */

.header {
  height: 48px;

  flex-shrink: 0;

  background: #1e1f22;

  border-bottom:
    1px solid #2b2d31;

  display: flex;
  align-items: center;

  justify-content: space-between;

  padding: 0 12px;

  z-index: 20;
}

.title {
  font-size: 14px;
  font-weight: 700;

  color: #fff;
}

.status {
  font-size: 11px;

  color: #949ba4;
}


/* =========================================================
   Editor
========================================================= */

.editor {
  position: relative;

  flex: 1;

  min-height: 0;

  overflow: hidden;

  background: #111214;

  touch-action: none;
}


/* =========================================================
   Canvas
========================================================= */

#canvas {
  position: absolute;

  left: 0;
  top: 0;

  display: block;

  touch-action: none;

  transform-origin: 0 0;
}


/* =========================================================
   Empty
========================================================= */

.empty {
  position: absolute;

  left: 50%;
  top: 50%;

  transform:
    translate(-50%, -50%);

  text-align: center;

  color: #72767d;

  pointer-events: none;

  z-index: 2;
}

.empty-title {
  font-size: 17px;
  font-weight: 700;

  margin-bottom: 6px;
}

.empty-text {
  font-size: 12px;
}


/* =========================================================
   Crop Overlay
========================================================= */

#cropOverlay {
  position: absolute;

  display: none;

  border:
    2px dashed #ffffff;

  background:
    rgba(255,255,255,0.08);

  pointer-events: none;

  z-index: 10;
}

.crop-corner {
  position: absolute;

  width: 12px;
  height: 12px;

  background: #fff;

  border:
    2px solid #5865f2;

  border-radius: 50%;
}

.crop-tl {
  left: -7px;
  top: -7px;
}

.crop-tr {
  right: -7px;
  top: -7px;
}

.crop-bl {
  left: -7px;
  bottom: -7px;
}

.crop-br {
  right: -7px;
  bottom: -7px;
}


/* =========================================================
   Bottom Toolbar
========================================================= */

.toolbar {
  height: 70px;

  flex-shrink: 0;

  background: #1e1f22;

  border-top:
    1px solid #2b2d31;

  display: flex;

  align-items: center;

  justify-content: center;

  gap: 6px;

  padding:
    7px 8px;

  overflow-x: auto;

  overflow-y: hidden;

  -webkit-overflow-scrolling: touch;

  z-index: 30;
}

.toolbar::-webkit-scrollbar {
  display: none;
}


/* =========================================================
   Tool Button
========================================================= */

.tool-button {
  width: 52px;
  height: 52px;

  flex:
    0 0 52px;

  border: none;

  border-radius: 9px;

  background: #2b2d31;

  display: flex;

  align-items: center;

  justify-content: center;

  padding: 6px;

  cursor: pointer;

  -webkit-tap-highlight-color:
    transparent;
}

.tool-button img {
  width: 40px;
  height: 40px;

  display: block;

  object-fit: contain;

  pointer-events: none;
}

.tool-button.active {
  background: #5865f2;
}

.tool-button:active {
  transform: scale(0.94);
}


/* =========================================================
   Color Button
========================================================= */

.color-wrap {
  position: relative;

  width: 52px;
  height: 52px;

  flex:
    0 0 52px;
}

#colorInput {
  position: absolute;

  width: 52px;
  height: 52px;

  padding: 5px;

  border: none;

  border-radius: 9px;

  background: #2b2d31;

  cursor: pointer;
}


/* =========================================================
   Desktop
========================================================= */

@media (min-width: 700px) {

  .toolbar {
    gap: 8px;
  }

  .tool-button {
    width: 56px;
    height: 56px;

    flex-basis: 56px;
  }

  .tool-button img {
    width: 42px;
    height: 42px;
  }

  .color-wrap,
  #colorInput {
    width: 56px;
    height: 56px;
  }

}

</style>
</head>


<body>

<div id="app">


  <!-- =====================================================
       Header
  ====================================================== -->

  <header class="header">

    <div class="title">
      S222 Image Editor
    </div>

    <div
      id="status"
      class="status">

      画像未読み込み

    </div>

  </header>


  <!-- =====================================================
       Editor
  ====================================================== -->

  <main
    id="editor"
    class="editor">

    <canvas
      id="canvas">
    </canvas>


    <div
      id="empty"
      class="empty">

      <div class="empty-title">
        画像を読み込んでください
      </div>

      <div class="empty-text">
        スクリーンショットを加工できます
      </div>

    </div>


    <!-- Crop -->

    <div
      id="cropOverlay">

      <div
        class="crop-corner crop-tl">
      </div>

      <div
        class="crop-corner crop-tr">
      </div>

      <div
        class="crop-corner crop-bl">
      </div>

      <div
        class="crop-corner crop-br">
      </div>

    </div>

  </main>


  <!-- =====================================================
       Toolbar
  ====================================================== -->

  <nav class="toolbar">


    <!-- Image -->

    <button
      class="tool-button"
      id="loadButton"
      title="画像読み込み">

      <img
        src="image/add-image-48.png"
        alt="画像">

    </button>


    <!-- Crop -->

    <button
      class="tool-button"
      id="cropButton"
      title="切り抜き">

      <img
        src="image/trim-image-48.png"
        alt="切り抜き">

    </button>


    <!-- Circle -->

    <button
      class="tool-button"
      data-tool="circle"
      title="円">

      <img
        src="image/circle-48.png"
        alt="円">

    </button>


    <!-- Square -->

    <button
      class="tool-button"
      data-tool="rect"
      title="四角">

      <img
        src="image/square-48.png"
        alt="四角">

    </button>


    <!-- Arrow -->

    <button
      class="tool-button"
      data-tool="arrow"
      title="矢印">

      <img
        src="image/up-right-48.png"
        alt="矢印">

    </button>


    <!-- Numbers -->

    <button
      class="tool-button"
      data-tool="number"
      title="①〜⑤">

      <img
        src="image/numbers-48.png"
        alt="数字">

    </button>


    <!-- ABC -->

    <button
      class="tool-button"
      data-tool="letter"
      title="A〜E">

      <img
        src="image/abc-48.png"
        alt="ABC">

    </button>


    <!-- Delete -->

    <button
      class="tool-button"
      id="deleteButton"
      title="削除">

      <img
        src="image/close-48.png"
        alt="削除">

    </button>


    <!-- Clear -->

    <button
      class="tool-button"
      id="clearButton"
      title="全消去">

      <img
        src="image/dl-48.png"
        alt="全消去">

    </button>


    <!-- Undo -->

    <button
      class="tool-button"
      id="undoButton"
      title="一つ前に戻す">

      <img
        src="image/undo-48.png"
        alt="Undo">

    </button>


    <!-- Color -->

    <div
      class="color-wrap"
      title="色">

      <input
        id="colorInput"
        type="color"
        value="#ff0000">

    </div>


    <!-- Save -->

    <button
      class="tool-button"
      id="saveButton"
      title="保存">

      <img
        src="image/save-48.png"
        alt="保存">

    </button>


  </nav>


  <input
    id="fileInput"
    type="file"
    accept="image/*"
    hidden>


</div>


<script>

/* =========================================================
   Elements
========================================================= */

const editor =
  document.getElementById("editor");

const canvas =
  document.getElementById("canvas");

const ctx =
  canvas.getContext("2d");

const empty =
  document.getElementById("empty");

const status =
  document.getElementById("status");

const fileInput =
  document.getElementById("fileInput");

const loadButton =
  document.getElementById("loadButton");

const cropButton =
  document.getElementById("cropButton");

const deleteButton =
  document.getElementById("deleteButton");

const clearButton =
  document.getElementById("clearButton");

const undoButton =
  document.getElementById("undoButton");

const saveButton =
  document.getElementById("saveButton");

const colorInput =
  document.getElementById("colorInput");

const cropOverlay =
  document.getElementById("cropOverlay");


/* =========================================================
   State
========================================================= */

let image = null;

let objects = [];

let selectedObject = null;

let currentTool = null;

let numberIndex = 0;

let letterIndex = 0;

let history = [];

let cropMode = false;

let cropStart = null;

let cropEnd = null;


/* =========================================================
   View
========================================================= */

let viewScale = 1;

let viewX = 0;

let viewY = 0;

let minScale = 1;

let maxScale = 5;


/* =========================================================
   Interaction
========================================================= */

let pointerMode = null;

let activePointerId = null;

let startPointer = null;

let lastPointer = null;

let startObjectState = null;

let pinchStartDistance = 0;

let pinchStartScale = 1;

let pinchStartCenter = null;

let pinchStartView = null;

const pointers = new Map();


/* =========================================================
   Helpers
========================================================= */

function cloneObjects() {

  return JSON.parse(
    JSON.stringify(objects)
  );

}


function saveHistory() {

  history.push({
    objects:
      cloneObjects(),

    numberIndex,

    letterIndex
  });

  if (history.length > 50) {

    history.shift();

  }

}


function undo() {

  if (!history.length) {

    return;

  }

  const state =
    history.pop();

  objects =
    state.objects || [];

  numberIndex =
    state.numberIndex || 0;

  letterIndex =
    state.letterIndex || 0;

  selectedObject = null;

  draw();

}


/* =========================================================
   Undo
========================================================= */

undoButton.addEventListener(
  "click",
  event => {

    event.stopPropagation();

    undo();

  }
);


/* =========================================================
   Load Image
========================================================= */

loadButton.addEventListener(
  "click",
  () => {

    fileInput.click();

  }
);


fileInput.addEventListener(
  "change",
  event => {

    const file =
      event.target.files[0];

    if (!file) {

      return;

    }

    const reader =
      new FileReader();

    reader.onload =
      event => {

        const img =
          new Image();

        img.onload =
          () => {

            image = img;

            canvas.width =
              img.naturalWidth;

            canvas.height =
              img.naturalHeight;

            objects = [];

            selectedObject = null;

            history = [];

            numberIndex = 0;

            letterIndex = 0;

            empty.style.display =
              "none";

            fitImage();

            draw();

            updateStatus();

          };

        img.src =
          event.target.result;

      };

    reader.readAsDataURL(file);

    fileInput.value = "";

  }
);


/* =========================================================
   Initial Image Fit
========================================================= */

function fitImage() {

  if (!image) {

    return;

  }

  const editorWidth =
    editor.clientWidth;

  const editorHeight =
    editor.clientHeight;

  /*
   * 画面の高さに合わせる。
   * 上端に配置する。
   */

  viewScale =
    editorHeight /
    canvas.height;

  minScale =
    viewScale;

  if (
    viewScale < 0.1
  ) {

    viewScale = 0.1;
    minScale = 0.1;

  }

  /*
   * 横方向は中央。
   * 縦方向は上端。
   */

  viewX =
    (
      editorWidth -
      canvas.width *
      viewScale
    ) / 2;

  viewY = 0;

  applyCanvasTransform();

}


/* =========================================================
   Canvas Transform
========================================================= */

function applyCanvasTransform() {

  canvas.style.transform =
    `translate(${viewX}px, ${viewY}px)
     scale(${viewScale})`;

  updateCropOverlay();

}


/* =========================================================
   Screen -> Image Coordinates
========================================================= */

function screenToImage(
  clientX,
  clientY
) {

  const rect =
    editor.getBoundingClientRect();

  return {

    x:
      (
        clientX -
        rect.left -
        viewX
      ) / viewScale,

    y:
      (
        clientY -
        rect.top -
        viewY
      ) / viewScale

  };

}


/* =========================================================
   Image -> Screen Coordinates
========================================================= */

function imageToScreen(
  x,
  y
) {

  return {

    x:
      x *
      viewScale +
      viewX,

    y:
      y *
      viewScale +
      viewY

  };

}


/* =========================================================
   Tools
========================================================= */

document
  .querySelectorAll(
    "[data-tool]"
  )
  .forEach(
    button => {

      button.addEventListener(
        "click",
        () => {

          if (!image) {

            return;

          }

          currentTool =
            button.dataset.tool;

          cropMode = false;

          cropButton.classList.remove(
            "active"
          );

          document
            .querySelectorAll(
              "[data-tool]"
            )
            .forEach(
              b =>
                b.classList.remove(
                  "active"
                )
            );

          button.classList.add(
            "active"
          );

          updateStatus();

        }
      );

    }
  );


/* =========================================================
   Crop Button
========================================================= */

cropButton.addEventListener(
  "click",
  () => {

    if (!image) {

      return;

    }

    cropMode =
      !cropMode;

    currentTool = null;

    document
      .querySelectorAll(
        "[data-tool]"
      )
      .forEach(
        b =>
          b.classList.remove(
            "active"
          )
      );

    cropButton.classList.toggle(
      "active",
      cropMode
    );

    cropStart = null;
    cropEnd = null;

    cropOverlay.style.display =
      "none";

    updateStatus();

  }
);


/* =========================================================
   Pointer Down
========================================================= */

editor.addEventListener(
  "pointerdown",
  event => {

    if (!image) {

      return;

    }

    pointers.set(
      event.pointerId,
      {
        x: event.clientX,
        y: event.clientY
      }
    );

    editor.setPointerCapture(
      event.pointerId
    );


    /* =====================================================
       Pinch
    ====================================================== */

    if (pointers.size === 2) {

      const values =
        [...pointers.values()];

      pinchStartDistance =
        distance(
          values[0],
          values[1]
        );

      pinchStartScale =
        viewScale;

      pinchStartCenter =
        midpoint(
          values[0],
          values[1]
        );

      pinchStartView = {
        x: viewX,
        y: viewY
      };

      pointerMode =
        "pinch";

      return;

    }


    const point =
      screenToImage(
        event.clientX,
        event.clientY
      );


    /* =====================================================
       Crop
    ====================================================== */

    if (cropMode) {

      cropStart =
        clampPoint(
          point
        );

      cropEnd =
        cropStart;

      pointerMode =
        "crop";

      updateCropOverlay();

      return;

    }


    /* =====================================================
       Number / Letter
    ====================================================== */

    if (
      currentTool === "number" ||
      currentTool === "letter"
    ) {

      saveHistory();

      const obj = {

        type:
          currentTool,

        x:
          point.x,

        y:
          point.y,

        size:
          Math.max(
            48,
            canvas.width *
            0.045
          ),

        color:
          colorInput.value

      };


      if (
        currentTool === "number"
      ) {

        if (
          numberIndex >= 5
        ) {

          numberIndex = 0;

        }

        obj.text =
          ["①","②","③","④","⑤"]
            [numberIndex];

        numberIndex++;

      } else {

        if (
          letterIndex >= 5
        ) {

          letterIndex = 0;

        }

        obj.text =
          String.fromCharCode(
            65 +
            letterIndex
          );

        letterIndex++;

      }

      objects.push(obj);

      selectedObject =
        obj;

      draw();

      return;

    }


    /* =====================================================
       Shape / Arrow
    ====================================================== */

    if (
      currentTool === "circle" ||
      currentTool === "rect" ||
      currentTool === "arrow"
    ) {

      saveHistory();

      startPointer =
        point;

      pointerMode =
        "draw";

      return;

    }


    /* =====================================================
       Existing Object
    ====================================================== */

    const hit =
      hitTest(
        point.x,
        point.y
      );

    if (hit) {

      selectedObject =
        hit;

      saveHistory();

      startObjectState =
        JSON.parse(
          JSON.stringify(hit)
        );

      startPointer =
        point;

      pointerMode =
        "object";

      draw();

      return;

    }


    /* =====================================================
       Pan
    ====================================================== */

    pointerMode =
      "pan";

    lastPointer = {
      x: event.clientX,
      y: event.clientY
    };

  }
);


/* =========================================================
   Pointer Move
========================================================= */

editor.addEventListener(
  "pointermove",
  event => {

    if (!image) {

      return;

    }

    if (
      !pointers.has(
        event.pointerId
      )
    ) {

      return;

    }

    pointers.set(
      event.pointerId,
      {
        x: event.clientX,
        y: event.clientY
      }
    );


    /* =====================================================
       Pinch
    ====================================================== */

    if (
      pointerMode === "pinch" &&
      pointers.size >= 2
    ) {

      const values =
        [...pointers.values()];

      const currentDistance =
        distance(
          values[0],
          values[1]
        );

      const ratio =
        currentDistance /
        pinchStartDistance;

      let newScale =
        pinchStartScale *
        ratio;

      newScale =
        Math.max(
          minScale,
          Math.min(
            maxScale,
            newScale
          )
        );

      const center =
        midpoint(
          values[0],
          values[1]
        );

      /*
       * ズーム中心を維持
       */

      const rect =
        editor.getBoundingClientRect();

      const cx =
        center.x -
        rect.left;

      const cy =
        center.y -
        rect.top;

      const imageX =
        (
          cx -
          pinchStartView.x
        ) /
        pinchStartScale;

      const imageY =
        (
          cy -
          pinchStartView.y
        ) /
        pinchStartScale;

      viewScale =
        newScale;

      viewX =
        cx -
        imageX *
        newScale;

      viewY =
        cy -
        imageY *
        newScale;

      applyCanvasTransform();

      return;

    }


    if (!pointerMode) {

      return;

    }

    const point =
      screenToImage(
        event.clientX,
        event.clientY
      );


    /* =====================================================
       Crop
    ====================================================== */

    if (
      pointerMode === "crop"
    ) {

      cropEnd =
        clampPoint(
          point
        );

      updateCropOverlay();

      return;

    }


    /* =====================================================
       Draw
    ====================================================== */

    if (
      pointerMode === "draw"
    ) {

      drawPreview(
        point
      );

      return;

    }


    /* =====================================================
       Move Object
    ====================================================== */

    if (
      pointerMode === "object" &&
      selectedObject &&
      startPointer
    ) {

      const dx =
        point.x -
        startPointer.x;

      const dy =
        point.y -
        startPointer.y;

      const original =
        startObjectState;

      if (
        selectedObject.type === "arrow"
      ) {

        selectedObject.x1 =
          original.x1 +
          dx;

        selectedObject.y1 =
          original.y1 +
          dy;

        selectedObject.x2 =
          original.x2 +
          dx;

        selectedObject.y2 =
          original.y2 +
          dy;

      } else {

        selectedObject.x =
          original.x +
          dx;

        selectedObject.y =
          original.y +
          dy;

      }

      draw();

      return;

    }


    /* =====================================================
       Pan
    ====================================================== */

    if (
      pointerMode === "pan"
    ) {

      if (!lastPointer) {

        lastPointer = {
          x: event.clientX,
          y: event.clientY
        };

        return;

      }

      const dx =
        event.clientX -
        lastPointer.x;

      const dy =
        event.clientY -
        lastPointer.y;

      viewX += dx;
      viewY += dy;

      lastPointer = {
        x: event.clientX,
        y: event.clientY
      };

      applyCanvasTransform();

    }

  }
);


/* =========================================================
   Pointer Up
========================================================= */

editor.addEventListener(
  "pointerup",
  event => {

    pointers.delete(
      event.pointerId
    );


    /* =====================================================
       Pinch End
    ====================================================== */

    if (
      pointerMode === "pinch"
    ) {

      if (
        pointers.size < 2
      ) {

        pointerMode = null;

      }

      return;

    }


    /* =====================================================
       Crop
    ====================================================== */

    if (
      pointerMode === "crop"
    ) {

      if (
        cropStart &&
        cropEnd
      ) {

        applyCrop();

      }

      pointerMode = null;

      return;

    }


    /* =====================================================
       Draw
    ====================================================== */

    if (
      pointerMode === "draw"
    ) {

      const point =
        screenToImage(
          event.clientX,
          event.clientY
        );

      finishDrawing(
        point
      );

      pointerMode = null;

      return;

    }


    /* =====================================================
       Object
    ====================================================== */

    if (
      pointerMode === "object"
    ) {

      pointerMode = null;

      startPointer = null;

      startObjectState = null;

      draw();

      return;

    }


    /* =====================================================
       Pan
    ====================================================== */

    if (
      pointerMode === "pan"
    ) {

      pointerMode = null;

      lastPointer = null;

    }

  }
);


/* =========================================================
   Pointer Cancel
========================================================= */

editor.addEventListener(
  "pointercancel",
  event => {

    pointers.delete(
      event.pointerId
    );

    pointerMode = null;

  }
);


/* =========================================================
   Draw Preview
========================================================= */

function drawPreview(
  endPoint
) {

  draw();

  if (!startPointer) {

    return;

  }

  ctx.save();

  ctx.strokeStyle =
    colorInput.value;

  ctx.fillStyle =
    colorInput.value;

  ctx.lineWidth =
    8 /
    viewScale;

  ctx.lineCap =
    "round";

  ctx.lineJoin =
    "round";


  if (
    currentTool === "circle"
  ) {

    const radius =
      Math.sqrt(
        Math.pow(
          endPoint.x -
          startPointer.x,
          2
        ) +
        Math.pow(
          endPoint.y -
          startPointer.y,
          2
        )
      );

    ctx.beginPath();

    ctx.arc(
      startPointer.x,
      startPointer.y,
      radius,
      0,
      Math.PI * 2
    );

    ctx.stroke();

  }


  if (
    currentTool === "rect"
  ) {

    const x =
      Math.min(
        startPointer.x,
        endPoint.x
      );

    const y =
      Math.min(
        startPointer.y,
        endPoint.y
      );

    const width =
      Math.abs(
        endPoint.x -
        startPointer.x
      );

    const height =
      Math.abs(
        endPoint.y -
        startPointer.y
      );

    ctx.strokeRect(
      x,
      y,
      width,
      height
    );

  }


  if (
    currentTool === "arrow"
  ) {

    drawArrow(
      startPointer.x,
      startPointer.y,
      endPoint.x,
      endPoint.y,
      colorInput.value
    );

  }

  ctx.restore();

}


/* =========================================================
   Finish Drawing
========================================================= */

function finishDrawing(
  endPoint
) {

  if (!startPointer) {

    return;

  }

  let obj = null;


  if (
    currentTool === "circle"
  ) {

    const radius =
      Math.sqrt(
        Math.pow(
          endPoint.x -
          startPointer.x,
          2
        ) +
        Math.pow(
          endPoint.y -
          startPointer.y,
          2
        )
      );

    if (radius > 5) {

      obj = {

        type:
          "circle",

        x:
          startPointer.x,

        y:
          startPointer.y,

        radius,

        color:
          colorInput.value

      };

    }

  }


  if (
    currentTool === "rect"
  ) {

    const width =
      Math.abs(
        endPoint.x -
        startPointer.x
      );

    const height =
      Math.abs(
        endPoint.y -
        startPointer.y
      );

    if (
      width > 5 &&
      height > 5
    ) {

      obj = {

        type:
          "rect",

        x:
          (
            startPointer.x +
            endPoint.x
          ) / 2,

        y:
          (
            startPointer.y +
            endPoint.y
          ) / 2,

        width,

        height,

        color:
          colorInput.value

      };

    }

  }


  if (
    currentTool === "arrow"
  ) {

    const distanceValue =
      distance(
        startPointer,
        endPoint
      );

    if (
      distanceValue > 10
    ) {

      obj = {

        type:
          "arrow",

        x1:
          startPointer.x,

        y1:
          startPointer.y,

        x2:
          endPoint.x,

        y2:
          endPoint.y,

        color:
          colorInput.value

      };

    }

  }


  if (obj) {

    objects.push(obj);

    selectedObject =
      obj;

  }


  currentTool = null;

  document
    .querySelectorAll(
      "[data-tool]"
    )
    .forEach(
      b =>
        b.classList.remove(
          "active"
        )
    );

  draw();

}


/* =========================================================
   Hit Test
========================================================= */

function hitTest(
  x,
  y
) {

  for (
    let i =
      objects.length - 1;
    i >= 0;
    i--
  ) {

    const o =
      objects[i];


    if (
      o.type === "circle"
    ) {

      const dx =
        x - o.x;

      const dy =
        y - o.y;

      const distanceValue =
        Math.sqrt(
          dx * dx +
          dy * dy
        );

      if (
        Math.abs(
          distanceValue -
          o.radius
        ) < 25 ||
        distanceValue <
          o.radius
      ) {

        return o;

      }

    }


    if (
      o.type === "rect"
    ) {

      const left =
        o.x -
        o.width / 2;

      const right =
        o.x +
        o.width / 2;

      const top =
        o.y -
        o.height / 2;

      const bottom =
        o.y +
        o.height / 2;

      if (
        x >= left &&
        x <= right &&
        y >= top &&
        y <= bottom
      ) {

        return o;

      }

    }


    if (
      o.type === "arrow"
    ) {

      if (
        pointToLineDistance(
          x,
          y,
          o.x1,
          o.y1,
          o.x2,
          o.y2
        ) < 30
      ) {

        return o;

      }

    }


    if (
      o.type === "number" ||
      o.type === "letter"
    ) {

      const size =
        o.size || 70;

      if (
        x >=
          o.x -
          size &&
        x <=
          o.x +
          size &&
        y >=
          o.y -
          size &&
        y <=
          o.y +
          size
      ) {

        return o;

      }

    }

  }

  return null;

}


/* =========================================================
   Line Distance
========================================================= */

function pointToLineDistance(
  px,
  py,
  x1,
  y1,
  x2,
  y2
) {

  const A =
    px - x1;

  const B =
    py - y1;

  const C =
    x2 - x1;

  const D =
    y2 - y1;

  const dot =
    A * C +
    B * D;

  const length =
    C * C +
    D * D;

  let parameter =
    -1;

  if (length !== 0) {

    parameter =
      dot /
      length;

  }

  let xx;
  let yy;


  if (
    parameter < 0
  ) {

    xx = x1;
    yy = y1;

  } else if (
    parameter > 1
  ) {

    xx = x2;
    yy = y2;

  } else {

    xx =
      x1 +
      parameter *
      C;

    yy =
      y1 +
      parameter *
      D;

  }

  const dx =
    px - xx;

  const dy =
    py - yy;

  return Math.sqrt(
    dx * dx +
    dy * dy
  );

}


/* =========================================================
   Draw
========================================================= */

function draw() {

  ctx.clearRect(
    0,
    0,
    canvas.width,
    canvas.height
  );


  if (image) {

    ctx.drawImage(
      image,
      0,
      0,
      canvas.width,
      canvas.height
    );

  }


  objects.forEach(
    drawObject
  );

}


/* =========================================================
   Draw Object
========================================================= */

function drawObject(
  o
) {

  ctx.save();


  if (
    o.type === "circle"
  ) {

    ctx.strokeStyle =
      o.color ||
      "#ff0000";

    ctx.lineWidth =
      8;

    ctx.beginPath();

    ctx.arc(
      o.x,
      o.y,
      o.radius,
      0,
      Math.PI * 2
    );

    ctx.stroke();

  }


  if (
    o.type === "rect"
  ) {

    ctx.strokeStyle =
      o.color ||
      "#ff0000";

    ctx.lineWidth =
      8;

    ctx.strokeRect(
      o.x -
        o.width / 2,

      o.y -
        o.height / 2,

      o.width,

      o.height
    );

  }


  if (
    o.type === "arrow"
  ) {

    drawArrow(
      o.x1,
      o.y1,
      o.x2,
      o.y2,
      o.color
    );

  }


  if (
    o.type === "number" ||
    o.type === "letter"
  ) {

    drawMarker(o);

  }


  if (
    o === selectedObject
  ) {

    drawSelection(o);

  }

  ctx.restore();

}


/* =========================================================
   Arrow
========================================================= */

function drawArrow(
  x1,
  y1,
  x2,
  y2,
  color
) {

  const dx =
    x2 - x1;

  const dy =
    y2 - y1;

  const angle =
    Math.atan2(
      dy,
      dx
    );

  const length =
    Math.sqrt(
      dx * dx +
      dy * dy
    );

  const headLength =
    Math.min(
      50,
      Math.max(
        25,
        length * 0.16
      )
    );


  /*
   * 背景に埋もれないよう
   * シャドウを入れる。
   */

  ctx.save();

  ctx.strokeStyle =
    color ||
    "#ff0000";

  ctx.fillStyle =
    color ||
    "#ff0000";

  ctx.lineWidth =
    10;

  ctx.lineCap =
    "round";

  ctx.lineJoin =
    "round";

  ctx.shadowColor =
    "rgba(0,0,0,0.75)";

  ctx.shadowBlur =
    8;


  ctx.beginPath();

  ctx.moveTo(
    x1,
    y1
  );

  ctx.lineTo(
    x2,
    y2
  );

  ctx.stroke();


  ctx.shadowBlur = 0;


  ctx.beginPath();

  ctx.moveTo(
    x2,
    y2
  );

  ctx.lineTo(
    x2 -
      headLength *
      Math.cos(
        angle -
        Math.PI / 6
      ),

    y2 -
      headLength *
      Math.sin(
        angle -
        Math.PI / 6
      )
  );

  ctx.lineTo(
    x2 -
      headLength *
      Math.cos(
        angle +
        Math.PI / 6
      ),

    y2 -
      headLength *
      Math.sin(
        angle +
        Math.PI / 6
      )
  );

  ctx.closePath();

  ctx.fill();

  ctx.restore();

}


/* =========================================================
   Marker
========================================================= */

function drawMarker(
  o
) {

  const size =
    o.size || 70;

  const radius =
    size * 0.68;


  /*
   * 白丸
   */

  ctx.fillStyle =
    "#ffffff";

  ctx.beginPath();

  ctx.arc(
    o.x,
    o.y,
    radius,
    0,
    Math.PI * 2
  );

  ctx.fill();


  /*
   * 黒文字
   */

  ctx.fillStyle =
    "#000000";

  ctx.font =
    `bold ${size * 0.72}px sans-serif`;

  ctx.textAlign =
    "center";

  ctx.textBaseline =
    "middle";

  ctx.fillText(
    o.text,
    o.x,
    o.y
  );

}


/* =========================================================
   Selection
========================================================= */

function drawSelection(
  o
) {

  ctx.save();

  ctx.strokeStyle =
    "rgba(88,101,242,0.95)";

  ctx.lineWidth =
    3;

  ctx.setLineDash(
    [10,8]
  );


  if (
    o.type === "circle"
  ) {

    ctx.beginPath();

    ctx.arc(
      o.x,
      o.y,
      o.radius + 12,
      0,
      Math.PI * 2
    );

    ctx.stroke();

  }


  if (
    o.type === "rect"
  ) {

    ctx.strokeRect(
      o.x -
        o.width / 2 -
        10,

      o.y -
        o.height / 2 -
        10,

      o.width + 20,

      o.height + 20
    );

  }


  if (
    o.type === "arrow"
  ) {

    ctx.beginPath();

    ctx.moveTo(
      o.x1,
      o.y1
    );

    ctx.lineTo(
      o.x2,
      o.y2
    );

    ctx.stroke();

  }


  if (
    o.type === "number" ||
    o.type === "letter"
  ) {

    const size =
      o.size || 70;

    ctx.strokeRect(
      o.x -
        size,

      o.y -
        size,

      size * 2,

      size * 2
    );

  }

  ctx.restore();

}


/* =========================================================
   Delete Selected
========================================================= */

deleteButton.addEventListener(
  "click",
  () => {

    if (!selectedObject) {

      return;

    }

    saveHistory();

    objects =
      objects.filter(
        o =>
          o !==
          selectedObject
      );

    selectedObject = null;

    draw();

  }
);


/* =========================================================
   Clear All
========================================================= */

clearButton.addEventListener(
  "click",
  () => {

    if (!objects.length) {

      return;

    }

    saveHistory();

    objects = [];

    selectedObject = null;

    numberIndex = 0;

    letterIndex = 0;

    draw();

  }
);


/* =========================================================
   Color
========================================================= */

colorInput.addEventListener(
  "input",
  () => {

    if (!selectedObject) {

      return;

    }

    if (
      selectedObject.type ===
        "number" ||
      selectedObject.type ===
        "letter"
    ) {

      return;

    }

    saveHistory();

    selectedObject.color =
      colorInput.value;

    draw();

  }
);


/* =========================================================
   Crop
========================================================= */

function applyCrop() {

  if (
    !cropStart ||
    !cropEnd
  ) {

    return;

  }


  const x =
    Math.max(
      0,
      Math.min(
        cropStart.x,
        cropEnd.x
      )
    );

  const y =
    Math.max(
      0,
      Math.min(
        cropStart.y,
        cropEnd.y
      )
    );

  const right =
    Math.min(
      canvas.width,
      Math.max(
        cropStart.x,
        cropEnd.x
      )
    );

  const bottom =
    Math.min(
      canvas.height,
      Math.max(
        cropStart.y,
        cropEnd.y
      )
    );

  const width =
    right - x;

  const height =
    bottom - y;


  if (
    width < 10 ||
    height < 10
  ) {

    cropStart = null;
    cropEnd = null;

    cropOverlay.style.display =
      "none";

    return;

  }


  saveHistory();


  const tempCanvas =
    document.createElement(
      "canvas"
    );

  tempCanvas.width =
    width;

  tempCanvas.height =
    height;

  const tempCtx =
    tempCanvas.getContext(
      "2d"
    );


  /*
   * 画像＋既存オブジェクトを
   * 一度描画してから切り抜く。
   */

  tempCtx.drawImage(
    canvas,

    x,
    y,
    width,
    height,

    0,
    0,
    width,
    height
  );


  const cropped =
    new Image();


  cropped.onload =
    () => {

      image =
        cropped;

      canvas.width =
        width;

      canvas.height =
        height;


      /*
       * オブジェクトは
       * 既に画像へ焼き込まれているので
       * 一旦クリア。
       */

      objects = [];

      selectedObject = null;


      cropMode = false;

      cropButton.classList.remove(
        "active"
      );

      cropStart = null;

      cropEnd = null;

      cropOverlay.style.display =
        "none";


      fitImage();

      draw();

      updateStatus();

    };


  cropped.src =
    tempCanvas.toDataURL(
      "image/png"
    );

}


/* =========================================================
   Crop Overlay
========================================================= */

function updateCropOverlay() {

  if (
    !cropMode ||
    !cropStart ||
    !cropEnd
  ) {

    cropOverlay.style.display =
      "none";

    return;

  }


  const a =
    imageToScreen(
      cropStart.x,
      cropStart.y
    );

  const b =
    imageToScreen(
      cropEnd.x,
      cropEnd.y
    );

  const editorRect =
    editor.getBoundingClientRect();

  const left =
    Math.min(
      a.x,
      b.x
    );

  const top =
    Math.min(
      a.y,
      b.y
    );

  const width =
    Math.abs(
      b.x -
      a.x
    );

  const height =
    Math.abs(
      b.y -
      a.y
    );


  cropOverlay.style.left =
    `${left -
      editorRect.left}px`;

  cropOverlay.style.top =
    `${top -
      editorRect.top}px`;

  cropOverlay.style.width =
    `${width}px`;

  cropOverlay.style.height =
    `${height}px`;

  cropOverlay.style.display =
    "block";

}


/* =========================================================
   Save PNG
========================================================= */

saveButton.addEventListener(
  "click",
  () => {

    if (!image) {

      return;

    }

    /*
     * 選択枠を消す。
     */

    selectedObject = null;

    draw();


    /*
     * 現在のcanvasは
     * 元画像サイズなので、
     * そのままPNG保存する。
     */

    canvas.toBlob(
      blob => {

        if (!blob) {

          return;

        }

        const url =
          URL.createObjectURL(
            blob
          );

        const a =
          document.createElement(
            "a"
          );

        a.href =
          url;

        a.download =
          `S222-image-${Date.now()}.png`;

        document.body.appendChild(
          a
        );

        a.click();

        a.remove();

        URL.revokeObjectURL(
          url
        );

      },
      "image/png"
    );

  }
);


/* =========================================================
   Distance
========================================================= */

function distance(
  a,
  b
) {

  const dx =
    b.x - a.x;

  const dy =
    b.y - a.y;

  return Math.sqrt(
    dx * dx +
    dy * dy
  );

}


/* =========================================================
   Midpoint
========================================================= */

function midpoint(
  a,
  b
) {

  return {

    x:
      (a.x + b.x) / 2,

    y:
      (a.y + b.y) / 2

  };

}


/* =========================================================
   Clamp Point
========================================================= */

function clampPoint(
  p
) {

  return {

    x:
      Math.max(
        0,
        Math.min(
          canvas.width,
          p.x
        )
      ),

    y:
      Math.max(
        0,
        Math.min(
          canvas.height,
          p.y
        )
      )

  };

}


/* =========================================================
   Status
========================================================= */

function updateStatus() {

  if (!image) {

    status.textContent =
      "画像未読み込み";

    return;

  }

  if (cropMode) {

    status.textContent =
      "切り抜く範囲をドラッグ";

    return;

  }

  if (currentTool) {

    const names = {

      circle:
        "円",

      rect:
        "四角",

      arrow:
        "矢印",

      number:
        "①〜⑤",

      letter:
        "A〜E"

    };

    status.textContent =
      names[currentTool];

    return;

  }

  status.textContent =
    `${canvas.width} × ${canvas.height}`;

}


/* =========================================================
   Resize
========================================================= */

window.addEventListener(
  "resize",
  () => {

    if (!image) {

      return;

    }

    /*
     * 画面サイズが変わった場合でも
     * 現在の画像位置は基本維持。
     */

    applyCanvasTransform();

  }
);


/* =========================================================
   Initial
========================================================= */

updateStatus();

</script>
