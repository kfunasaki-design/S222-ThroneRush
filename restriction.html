<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>Participation Restriction | S222 Throne Rush</title>

<!-- Markdown Parser -->
<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>

<style>

/* ===============================
   BASE
================================ */

* {
  box-sizing: border-box;
}

html {
  scroll-behavior: smooth;
}

body {
  margin: 0;
  background: #0f0f0f;
  color: #eaeaea;

  font-family:
    -apple-system,
    BlinkMacSystemFont,
    "Segoe UI",
    Arial,
    sans-serif;
}


/* ===============================
   CONTAINER
================================ */

.container {
  width: 100%;
  max-width: 900px;

  margin: 0 auto;

  padding: 24px 16px 60px;
}


/* ===============================
   HEADER
================================ */

.page-header {
  display: flex;
  align-items: center;
  justify-content: space-between;

  margin-bottom: 28px;

  border-bottom: 1px solid #2a2a2a;
  padding-bottom: 14px;
}

.page-title h1 {
  margin: 0;

  font-size: 24px;
  letter-spacing: 1px;

  color: #ffffff;
}

.page-title p {
  margin: 4px 0 0;

  font-size: 13px;
  color: #888;
}


/* ===============================
   BACK BUTTON
================================ */

.back-button {
  display: inline-block;

  padding: 7px 12px;

  border: 1px solid #444;
  border-radius: 6px;

  background: #1a1a1a;
  color: #ccc;

  text-decoration: none;

  font-size: 13px;

  white-space: nowrap;

  transition:
    background 0.2s,
    border-color 0.2s;
}

.back-button:hover {
  background: #252525;
  border-color: #666;
}


/* ===============================
   MARKDOWN CONTENT
   Discord-like layout
================================ */

.markdown-content {
  width: 100%;
}


/* Headings */

.markdown-content h1 {

  margin:
    0
    0
    18px;

  font-size: 20px;

  color: #ffffff;
}


.markdown-content h2 {

  margin:
    26px
    0
    8px;

  font-size: 16px;

  color: #ffffff;
}


.markdown-content h3 {

  margin:
    18px
    0
    4px;

  font-size: 14px;

  color: #dddddd;
}


/* Paragraph */

.markdown-content p {

  margin:
    0
    0
    6px;

  font-size: 14px;

  line-height: 1.55;

  color: #bbbbbb;
}


/* Lists */

.markdown-content ul,
.markdown-content ol {

  margin:
    4px
    0
    10px;

  padding-left: 20px;
}


.markdown-content li {

  margin-bottom: 3px;

  font-size: 14px;

  line-height: 1.5;

  color: #bbbbbb;
}


/* Strong */

.markdown-content strong {
  color: #ffffff;
}


/* Horizontal Rule */

.markdown-content hr {

  border: none;

  border-top:
    1px solid #2a2a2a;

  margin: 24px 0;

}


/* Links */

.markdown-content a {

  color: #cccccc;

  text-decoration: underline;

}


/* ===============================
   FOOTER
================================ */

.footer {

  text-align: center;

  margin-top: 40px;

  font-size: 12px;

  color: #555;

}


/* ===============================
   MOBILE
================================ */

@media (max-width: 600px) {

  .container {
    padding: 18px 14px 50px;
  }


  .page-header {
    margin-bottom: 22px;
  }


  .page-title h1 {
    font-size: 19px;
  }


  .page-title p {
    font-size: 12px;
  }


  .back-button {
    padding: 6px 10px;
    font-size: 12px;
  }


  .markdown-content h1 {
    font-size: 18px;
  }


  .markdown-content h2 {
    font-size: 15px;
  }

}

</style>
</head>


<body>

<div class="container">


  <!-- ===============================
       HEADER
  ================================ -->

  <header class="page-header">

    <div class="page-title">

      <h1>
        PARTICIPATION RESTRICTION
      </h1>

    </div>


    <!-- BACK TO DISCORD -->

    <a
      href="https://discord.com/channels/1532246363260194866/1532542629726785597"
      class="back-button"
    >
      ← BACK
    </a>

  </header>


  <!-- ===============================
       MARKDOWN CONTENT
  ================================ -->

  <main
    id="markdown-content"
    class="markdown-content"
  >

    Loading...

  </main>


  <!-- ===============================
       FOOTER
  ================================ -->

  <footer class="footer">

    S222 THRONE RUSH

  </footer>


</div>


<!-- ===============================
     LOAD MARKDOWN
================================ -->

<script>

fetch("restriction.md")

  .then(response => {

    if (!response.ok) {
      throw new Error(
        "Failed to load restriction.md"
      );
    }

    return response.text();

  })

  .then(markdown => {

    document
      .getElementById("markdown-content")
      .innerHTML = marked.parse(markdown);

  })

  .catch(error => {

    document
      .getElementById("markdown-content")
      .innerHTML = `
        <p>
          Failed to load content.
        </p>
      `;

    console.error(error);

  });

</script>


</body>
</html>
